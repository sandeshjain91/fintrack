/* ═══════════════════════════════════
   UPLOAD STATEMENT
═══════════════════════════════════ */
function UploadStatement({accounts,setAccounts,categories}) {
  const [parsed,setParsed]=useState([]);
  const [target,setTarget]=useState("");
  const [done,setDone]=useState(false);
  const [err,setErr]=useState("");
  const [fileName,setFileName]=useState("");
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState("file"); // "file" | "paste"
  const [csv,setCsv]=useState("");
  const [importedBalance,setImportedBalance]=useState(null); // closing balance from statement
  const fileRef = React.useRef();

  /* ── parse Indian date strings: DD/MM/YY, DD/MM/YYYY, DD-MM-YYYY etc. ── */
  const parseIndianDate = raw => {
    // Strip trailing non-alphanumeric chars (HDFC appends letters like "01/03/26Z")
    const s = String(raw||"").trim().replace(/[^0-9\/\-\.]+$/,"").trim();
    // Excel serial number
    const num = parseFloat(s);
    if(!isNaN(num) && num > 40000 && num < 70000 && window.XLSX) {
      try {
        const d = window.XLSX.SSF.parse_date_code(num);
        return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
      } catch(e){}
    }
    // DD/MM/YY or DD/MM/YYYY or DD-MM-YYYY
    const m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
    if(m) {
      let [,dd,mm,yy]=m;
      if(yy.length===2) yy = parseInt(yy)<50?"20"+yy:"19"+yy;
      return `${yy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
    }
    // Standard ISO / other formats
    const d = new Date(s);
    return isNaN(d.getTime()) ? tod() : d.toISOString().slice(0,10);
  };

  /* ── scan all rows to find the actual header row (handles bank preamble rows) ── */
  const findHeaderRow = allRows => {
    const keywords = ["date","narration","narr","description","withdrawal","deposit","debit","credit","particulars"];
    for(let i=0;i<allRows.length;i++){
      const row = allRows[i].map(c=>String(c||"").trim().toLowerCase());
      const hits = row.filter(c => keywords.some(k=>c.includes(k)));
      if(hits.length >= 2) return i; // found header row
    }
    return 0;
  };

  /* ── shared row builder ── */
  const buildRows = (allRows) => {
    const hdrIdx = findHeaderRow(allRows);
    const hdr = allRows[hdrIdx].map(h=>String(h||"").trim().toLowerCase());
    const dataRows = allRows.slice(hdrIdx+1);

    const di  = hdr.findIndex(h=>h.includes("date") && !h.includes("value"));
    const ni  = hdr.findIndex(h=>h.includes("narr")||h.includes("desc")||h.includes("part")||h.includes("remark")||h.includes("detail")||h.includes("particular")||h.includes("transaction"));
    const dbi = hdr.findIndex(h=>h.includes("withdrawal")||h.includes("debit")||h.includes("withdr")||h.includes("dr "));
    const cri = hdr.findIndex(h=>h.includes("deposit")||h.includes("credit")||h.includes("cr "));
    // Closing/running balance column
    const bli = hdr.findIndex(h=>h.includes("closing")||h.includes("balance")||h.includes("bal"));

    const rows=[];
    let lastBalance = null;
    for(const c of dataRows){
      if(!c||c.length<2) continue;
      const clean = v => (v===undefined||v===null)?"":String(v).trim().replace(/"/g,"");
      const desc  = clean(ni>=0?c[ni]:c[1]);
      const raw   = clean(di>=0?c[di]:c[0]);
      const dateVal = parseIndianDate(raw);
      const deb  = dbi>=0?parseFloat(clean(c[dbi]).replace(/[^0-9.]/g,""))||0:0;
      const cred = cri>=0?parseFloat(clean(c[cri]).replace(/[^0-9.]/g,""))||0:0;
      // Capture closing balance from the row
      const balRaw = bli>=0?parseFloat(clean(c[bli]).replace(/[^0-9.]/g,""))||null:null;
      if(balRaw!==null && balRaw>0) lastBalance = balRaw;
      // Skip empty/summary rows
      if(!desc && !deb && !cred) continue;
      if(desc.toLowerCase().includes("opening balance")||desc.toLowerCase().includes("closing bal")||desc.toLowerCase().includes("statement summary")) continue;
      rows.push({id:uid(),date:dateVal,description:desc,debit:deb,credit:cred,balance:balRaw,category:autoCat(desc),notes:"Imported"});
    }
    return {rows, closingBalance: lastBalance};
  };

  /* ── parse Excel / CSV file ── */
  const handleFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    setErr(""); setDone(false); setParsed([]); setFileName(file.name); setLoading(true);
    const reader = new FileReader();
    const isCSV = file.name.toLowerCase().endsWith(".csv");

    reader.onload = ev => {
      try {
        let allRows;
        if(isCSV) {
          const text = ev.target.result;
          const lines = text.trim().split(/\r?\n/);
          allRows = lines.map(l=>l.split(",").map(x=>x.trim().replace(/"/g,"")));
        } else {
          // Excel using SheetJS
          const wb = window.XLSX.read(ev.target.result, {type:"array"});
          const ws = wb.Sheets[wb.SheetNames[0]];
          allRows = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
          if(allRows.length<2){setErr("Sheet appears empty.");setLoading(false);return;}
        }
        const {rows, closingBalance} = buildRows(allRows);
        if(!rows.length){setErr("No valid transactions found. Check that your file has Date, Narration/Description, Withdrawal/Debit, and Deposit/Credit columns.");setLoading(false);return;}
        setParsed(rows);
        if(closingBalance!==null) setImportedBalance(closingBalance);
      } catch(ex) {
        setErr("Could not read file: "+ex.message);
      }
      setLoading(false);
    };
    reader.onerror = ()=>{setErr("Failed to read file.");setLoading(false);};
    if(isCSV) reader.readAsText(file);
    else       reader.readAsArrayBuffer(file);
    // reset input so same file can be re-selected
    e.target.value="";
  };

  /* ── parse pasted CSV ── */
  const parsePaste = () => {
    setErr(""); setDone(false);
    const lines = csv.trim().split(/\r?\n/);
    if(lines.length<2){setErr("Need at least a header row and one data row.");return;}
    const allRows = lines.map(l=>l.split(",").map(x=>x.trim().replace(/"/g,"")));
    const {rows, closingBalance} = buildRows(allRows);
    if(!rows.length){setErr("No valid transactions found.");return;}
    setParsed(rows);
    if(closingBalance!==null) setImportedBalance(closingBalance);
  };

  const importAll=()=>{
    if(!target||!parsed.length) return;
    setAccounts(p=>p.map(a=>{
      if(a.id!==target) return a;
      const txns=[...(a.transactions||[]),...parsed];
      // Use statement's closing balance if available, otherwise compute from transactions
      const bal = importedBalance !== null
        ? importedBalance
        : (parseFloat(a.openingBalance)||0)+txns.reduce((s,t)=>s+(t.credit||0)-(t.debit||0),0);
      return {...a, transactions:txns, balance:bal};
    }));
    setDone(true); setParsed([]); setCsv(""); setFileName(""); setImportedBalance(null);
  };
  const updCat=(id,cat)=>setParsed(p=>p.map(t=>t.id===id?{...t,category:cat}:t));
  const delRow=id=>setParsed(p=>p.filter(t=>t.id!==id));

  return (
    <div>
      <h1 className="text-xl font-bold text-gray-800 mb-5">Upload Bank Statement</h1>

      {done && <div className="bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-3 mb-4 text-sm font-medium">✅ {parsed.length||""} Transactions imported successfully!</div>}
      {err  && <div className="bg-red-50 border border-red-200 text-red-600 rounded-lg px-4 py-3 mb-4 text-sm">⚠️ {err}</div>}

      {/* Tab switcher */}
      <div className="flex gap-2 mb-4">
        {[{id:"file",l:"📁 Upload File"},{id:"paste",l:"📋 Paste CSV"}].map(t=>(
          <button key={t.id} onClick={()=>{setTab(t.id);setParsed([]);setErr("");}} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${tab===t.id?"bg-indigo-600 text-white":"bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>{t.l}</button>
        ))}
      </div>

      {tab==="file" && (
        <div className="bg-white rounded-xl border shadow-sm p-6 mb-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-1">Upload Excel or CSV</h3>
          <p className="text-xs text-gray-400 mb-5">Supports <strong>.xlsx</strong>, <strong>.xls</strong>, and <strong>.csv</strong> files. Columns auto-detected — works with most Indian bank statement formats.</p>

          {/* Drop zone */}
          <div
            onClick={()=>fileRef.current.click()}
            className="border-2 border-dashed border-indigo-200 rounded-xl p-10 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition"
          >
            <div className="text-4xl mb-3">📂</div>
            {loading
              ? <div className="text-sm text-indigo-500 font-medium">Parsing file…</div>
              : fileName
              ? <div className="text-sm text-gray-700 font-medium">{fileName} — click to change</div>
              : <>
                  <div className="text-sm font-medium text-gray-700 mb-1">Click to select file</div>
                  <div className="text-xs text-gray-400">.xlsx · .xls · .csv</div>
                </>
            }
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile}/>

          {/* Column mapping guide */}
          <div className="mt-5 bg-gray-50 rounded-lg p-4">
            <div className="text-xs font-semibold text-gray-500 mb-1">Auto-detected columns — works with most Indian bank formats</div>
            <div className="text-xs text-gray-400 mb-3">Header rows and account info at the top of the file are automatically skipped.</div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {[
                ["Date","Date, Value Dt\n(DD/MM/YY or DD/MM/YYYY)"],
                ["Description","Narration, Description,\nParticulars, Remarks"],
                ["Debit / Out","Withdrawal Amt., Debit,\nWithdrawal"],
                ["Credit / In","Deposit Amt., Credit,\nDeposit"]
              ].map(([col,hint])=>(
                <div key={col} className="bg-white rounded border px-3 py-2">
                  <div className="text-xs font-semibold text-indigo-600">{col}</div>
                  <div className="text-xs text-gray-400 mt-0.5 whitespace-pre-line">{hint}</div>
                </div>
              ))}
            </div>
            <div className="mt-3 text-xs text-gray-400">✅ Tested with: HDFC Bank · SBI · ICICI · Axis · Kotak</div>
          </div>
        </div>
      )}

      {tab==="paste" && (
        <div className="bg-white rounded-xl border shadow-sm p-5 mb-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-1">Paste CSV Text</h3>
          <p className="text-xs text-gray-400 mb-3">Copy rows from your bank statement and paste below.</p>
          <textarea className={`${inp} h-36 font-mono text-xs`} value={csv} onChange={e=>{setCsv(e.target.value);setDone(false);setErr("");}}
            placeholder={"Date,Description,Debit,Credit\n01/03/2026,Amazon Purchase,1500,\n02/03/2026,Salary,,50000\n03/03/2026,Swiggy Order,350,"}/>
          <button className={`${btnP} mt-3`} onClick={parsePaste}>Parse</button>
        </div>
      )}

      {/* Preview table */}
      {parsed.length>0 && (
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-3">
            <div>
              <h3 className="font-semibold text-gray-700 text-sm">Preview — {parsed.length} transactions found</h3>
              <p className="text-xs text-gray-400 mt-0.5">Edit categories before importing. Remove rows you don't want.</p>
            </div>
            <div className="flex gap-2 items-center flex-wrap">
              <select className={`${inp} text-xs`} value={target} onChange={e=>setTarget(e.target.value)} style={{minWidth:180}}>
                <option value="">Select destination account…</option>
                {accounts.map(a=><option key={a.id} value={a.id}>{a.nickname||a.bankName}</option>)}
              </select>
              <button className={btnP} onClick={importAll} disabled={!target}>Import {parsed.length} Rows</button>
            </div>
          </div>

          {/* Closing balance banner */}
          {importedBalance!==null && (
            <div className="flex items-center gap-3 bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-2.5 mb-4">
              <span className="text-emerald-600 text-lg">✅</span>
              <div>
                <span className="text-sm font-semibold text-emerald-700">Closing balance detected from statement: {fmt(importedBalance)}</span>
                <p className="text-xs text-emerald-600 mt-0.5">Account balance will be set to <strong>{fmt(importedBalance)}</strong> after import — taken directly from the statement, not computed.</p>
              </div>
            </div>
          )}

          <Table cols={[
            {k:"date",l:"Date",r:r=>fd(r.date)},
            {k:"description",l:"Description",r:r=><span className="text-xs">{r.description}</span>},
            {k:"cat",l:"Category",r:r=>(
              <select className="border border-gray-200 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-indigo-300 outline-none" value={r.category} onChange={e=>updCat(r.id,e.target.value)}>
                {categories.map(c=><option key={c}>{c}</option>)}
              </select>
            )},
            {k:"debit",l:"Debit",r:r=>r.debit?<span className="text-red-600 font-medium">{fmt(r.debit)}</span>:""},
            {k:"credit",l:"Credit",r:r=>r.credit?<span className="text-green-600 font-medium">{fmt(r.credit)}</span>:""},
            {k:"balance",l:"Balance",r:r=>r.balance?<span className="text-gray-500 text-xs font-mono">{fmt(r.balance)}</span>:""},
            {k:"del",l:"",r:r=><button className="text-red-300 hover:text-red-500 text-xs" onClick={()=>delRow(r.id)} title="Remove row">✕</button>},
          ]} rows={parsed}/>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════
   BILLS
═══════════════════════════════════ */
const BILL_CATS = [
  "Electricity","Water","Gas","Internet","Mobile/Postpaid",
  "Rent","Home Loan EMI","Car Loan EMI","Personal Loan EMI","Education Loan EMI","Credit Card EMI","Other EMI",
  "Property Tax","Society Maintenance","Cable/DTH","Insurance Premium","School Fee","Other"
];
const BILL_FREQ = ["monthly","quarterly","yearly","one-time"];

function Bills({bills,setBills,accounts,setAccounts,categories}) {
  const [show,setShow]=useState(false);
  const [form,setForm]=useState({freq:"monthly",status:"unpaid"});
  const [filter,setFilter]=useState("all"); // all | unpaid | paid

  const save=()=>{
    if(!form.name||!form.amount) return;
    const item={...form, id:form.id||uid(), amount:parseFloat(form.amount)||0};
    setBills(p=>form.id ? p.map(b=>b.id===form.id?item:b) : [...p, item]);
    setShow(false); setForm({freq:"monthly",status:"unpaid"});
  };

  const del=id=>setBills(p=>p.filter(b=>b.id!==id));

  // Mark paid — optionally create a transaction in a bank account
  const markPaid=(bill)=>{
    setBills(p=>p.map(b=>{
      if(b.id!==bill.id) return b;
      const newEmis = b.totalEmis ? Math.min((parseInt(b.emisPaid)||0)+1, parseInt(b.totalEmis)) : b.emisPaid;
      const allDone = b.totalEmis && newEmis >= parseInt(b.totalEmis);
      return {...b, status:"paid", paidDate:tod(), emisPaid:newEmis, ...(allDone?{notes:(b.notes||"")+" ✅ Fully paid off"}:{})};
    }));
    // auto-create transaction if account linked
    if(bill.accountId && bill.accountId!=="none") {
      const txn={id:uid(),date:tod(),description:`Bill: ${bill.name}`,debit:bill.amount,credit:0,category:bill.category||"Bills",notes:"Bill payment"};
      setAccounts(prev=>prev.map(a=>{
        if(a.id!==bill.accountId) return a;
        const txns=[...(a.transactions||[]),txn];
        const bal=(parseFloat(a.openingBalance)||0)+txns.reduce((s,t)=>s+(t.credit||0)-(t.debit||0),0);
        return {...a,transactions:txns,balance:bal};
      }));
    }
  };

  // Reset all paid→unpaid when next cycle starts (simple: just unmark manually via "Reset")
  const resetBill=id=>setBills(p=>p.map(b=>b.id===id?{...b,status:"unpaid",paidDate:null}:b));

  const today30 = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const visible = bills.filter(b=> filter==="all" || b.status===filter);
  const totalUnpaid  = bills.filter(b=>b.status!=="paid").reduce((s,b)=>s+(b.amount||0),0);
  const totalMonthly = bills.reduce((s,b)=>s+(b.freq==="yearly"?(b.amount||0)/12:b.freq==="quarterly"?(b.amount||0)/3:(b.amount||0)),0);
  const overdueCount = bills.filter(b=>b.status!=="paid"&&b.dueDate&&b.dueDate<tod()).length;

  const statusBadge = b => {
    if(b.status==="paid") return <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">✓ Paid</span>;
    if(b.dueDate && b.dueDate < tod()) return <span className="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-600 font-medium">⚠ Overdue</span>;
    if(b.dueDate && b.dueDate <= today30) return <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium">Due soon</span>;
    return <span className="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 font-medium">Unpaid</span>;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">Bills</h1>
        <button className={btnP} onClick={()=>{setForm({freq:"monthly",status:"unpaid"});setShow(true);}}>+ Add Bill</button>
      </div>

      {/* Summary cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <Card title="Total Bills" value={bills.length} icon="🧾" grad="indigo"/>
        <Card title="Unpaid Amount" value={fmt(totalUnpaid)} sub={`${bills.filter(b=>b.status!=="paid").length} unpaid`} icon="💸" grad={totalUnpaid>0?"amber":"green"}/>
        <Card title="Monthly Total" value={fmt(totalMonthly)} icon="📅" grad="purple"/>
        <Card title="Overdue" value={overdueCount} icon="⚠️" grad={overdueCount>0?"red":"green"}/>
      </div>

      {/* Filters */}
      <div className="flex gap-2 mb-4">
        {["all","unpaid","paid"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition capitalize ${filter===f?"bg-indigo-600 text-white":"bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>{f}</button>
        ))}
      </div>

      {/* Bills list */}
      <div className="space-y-3">
        {visible.map(b=>(
          <div key={b.id} className={`bg-white rounded-xl border shadow-sm p-4 flex items-center gap-4 ${b.status!=="paid"&&b.dueDate&&b.dueDate<tod()?"border-red-200 bg-red-50/30":""}`}>
            {/* Icon */}
            <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg flex-shrink-0 ${b.status==="paid"?"bg-green-100":"bg-indigo-50"}`}>
              {b.status==="paid"?"✅":"🧾"}
            </div>
            {/* Info */}
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-gray-800 text-sm">{b.name}</span>
                {statusBadge(b)}
                <Tag color="gray">{b.category||"Bills"}</Tag>
                <Tag color="purple">{b.freq}</Tag>
              </div>
              <div className="flex items-center gap-4 mt-1 text-xs text-gray-500 flex-wrap">
                <span>Due: <strong className={b.dueDate&&b.dueDate<tod()&&b.status!=="paid"?"text-red-600":"text-gray-700"}>{fd(b.dueDate)||"—"}</strong></span>
                {b.paidDate && <span>Paid: <strong className="text-green-600">{fd(b.paidDate)}</strong></span>}
                {b.accountId&&b.accountId!=="none"&&accounts.find(a=>a.id===b.accountId)&&<span>→ {accounts.find(a=>a.id===b.accountId).nickname||accounts.find(a=>a.id===b.accountId).bankName}</span>}
                {b.lender&&<span>🏦 {b.lender}</span>}
                {b.totalEmis&&<span>EMI {b.emisPaid||0}/{b.totalEmis} ({Math.round(((b.emisPaid||0)/b.totalEmis)*100)}%)</span>}
                {b.landlord&&<span>👤 {b.landlord}</span>}
                {b.leaseEnd&&<span>Lease ends: {fd(b.leaseEnd)}</span>}
                {b.notes&&<span className="text-gray-400 italic truncate max-w-xs">{b.notes}</span>}
              </div>
              {/* EMI progress bar */}
              {b.totalEmis&&parseInt(b.totalEmis)>0&&(
                <div className="mt-2">
                  <div className="bg-gray-100 rounded-full h-1.5 w-48">
                    <div className="bg-indigo-500 h-1.5 rounded-full" style={{width:`${Math.min(((b.emisPaid||0)/b.totalEmis)*100,100)}%`}}/>
                  </div>
                </div>
              )}
            </div>
            {/* Amount */}
            <div className="text-right flex-shrink-0">
              <div className="font-bold text-gray-800">{fmt(b.amount)}</div>
              {b.freq!=="monthly"&&<div className="text-xs text-gray-400">{fmt(b.freq==="yearly"?b.amount/12:b.freq==="quarterly"?b.amount/3:b.amount)}/mo</div>}
            </div>
            {/* Actions */}
            <div className="flex gap-1 flex-shrink-0">
              {b.status!=="paid"
                ? <button className="bg-green-50 hover:bg-green-100 text-green-700 text-xs px-3 py-1.5 rounded-lg font-medium transition" onClick={()=>markPaid(b)}>Mark Paid</button>
                : <button className="bg-gray-50 hover:bg-gray-100 text-gray-500 text-xs px-3 py-1.5 rounded-lg font-medium transition" onClick={()=>resetBill(b.id)}>Reset</button>
              }
              <button className="text-indigo-400 hover:text-indigo-600 text-xs px-2 py-1.5 rounded-lg hover:bg-indigo-50 transition" onClick={()=>{setForm(b);setShow(true);}}>Edit</button>
              <button className="text-red-300 hover:text-red-500 text-xs px-2 py-1.5 rounded-lg hover:bg-red-50 transition" onClick={()=>del(b.id)}>✕</button>
            </div>
          </div>
        ))}
        {!visible.length && <div className="text-center text-gray-400 py-16 text-sm">{filter==="all"?"No bills added yet — click \"+ Add Bill\" to get started.":`No ${filter} bills.`}</div>}
      </div>

      {/* Add/Edit Modal */}
      <Modal open={show} onClose={()=>setShow(false)} title={form.id?"Edit Bill":"Add Bill"}>
        <F label="Bill Name"><input className={inp} value={form.name||""} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Electricity Bill"/></F>
        <div className="grid grid-cols-2 gap-3">
          <F label="Category">
            <select className={inp} value={form.category||""} onChange={e=>setForm({...form,category:e.target.value})}>
              <option value="">Select…</option>
              {BILL_CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </F>
          <F label="Amount"><input type="number" className={inp} value={form.amount||""} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="0"/></F>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <F label="Frequency">
            <select className={inp} value={form.freq||"monthly"} onChange={e=>setForm({...form,freq:e.target.value})}>
              {BILL_FREQ.map(f=><option key={f} value={f}>{f.charAt(0).toUpperCase()+f.slice(1)}</option>)}
            </select>
          </F>
          <F label="Due Date"><input type="date" className={inp} value={form.dueDate||""} onChange={e=>setForm({...form,dueDate:e.target.value})}/></F>
        </div>
        {/* EMI-specific fields */}
        {(form.category||"").toLowerCase().includes("emi") && (
          <div className="bg-indigo-50 rounded-lg p-3 mb-1">
            <div className="text-xs font-semibold text-indigo-600 mb-2">EMI Details</div>
            <div className="grid grid-cols-3 gap-3">
              <F label="Total EMIs"><input type="number" className={inp} value={form.totalEmis||""} onChange={e=>setForm({...form,totalEmis:e.target.value})} placeholder="e.g. 48"/></F>
              <F label="EMI Paid"><input type="number" className={inp} value={form.emisPaid||""} onChange={e=>setForm({...form,emisPaid:e.target.value})} placeholder="0"/></F>
              <F label="Interest Rate %"><input type="number" className={inp} value={form.interestRate||""} onChange={e=>setForm({...form,interestRate:e.target.value})} placeholder="e.g. 8.5"/></F>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <F label="Lender / Bank"><input className={inp} value={form.lender||""} onChange={e=>setForm({...form,lender:e.target.value})} placeholder="e.g. HDFC Bank"/></F>
              <F label="Loan Amount"><input type="number" className={inp} value={form.loanAmount||""} onChange={e=>setForm({...form,loanAmount:e.target.value})} placeholder="Principal"/></F>
            </div>
          </div>
        )}
        {/* Rent-specific fields */}
        {(form.category||"").toLowerCase()==="rent" && (
          <div className="bg-amber-50 rounded-lg p-3 mb-1">
            <div className="text-xs font-semibold text-amber-700 mb-2">Rent Details</div>
            <div className="grid grid-cols-2 gap-3">
              <F label="Landlord Name"><input className={inp} value={form.landlord||""} onChange={e=>setForm({...form,landlord:e.target.value})} placeholder="Name"/></F>
              <F label="Lease End Date"><input type="date" className={inp} value={form.leaseEnd||""} onChange={e=>setForm({...form,leaseEnd:e.target.value})}/></F>
            </div>
          </div>
        )}
        <F label="Pay from Account (auto-records transaction when marked paid)">
          <select className={inp} value={form.accountId||"none"} onChange={e=>setForm({...form,accountId:e.target.value})}>
            <option value="none">— Don't record transaction —</option>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.nickname||a.bankName}</option>)}
          </select>
        </F>
        <F label="Notes"><input className={inp} value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Optional"/></F>
        <div className="flex gap-2 pt-1">
          <button className={btnP} onClick={save}>Save</button>
          <button className={btnS} onClick={()=>setShow(false)}>Cancel</button>
        </div>
      </Modal>
    </div>
  );
}

/* ═══════════════════════════════════
   REPORTS
═══════════════════════════════════ */
function Reports({accounts,cards,investments,subscriptions,bills,income}) {
  const [tab,setTab]=useState("cashflow");

  /* ── All transactions ── */
  const allT=[
    ...accounts.flatMap(a=>(a.transactions||[]).map(t=>({...t}))),
    ...cards.flatMap(c=>(c.transactions||[]).map(t=>({...t})))
  ].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  /* ── This month ── */
  const thisM=tod().slice(0,7);
  const mT=allT.filter(t=>mk(t.date)===thisM);
  const mInc=mT.reduce((s,t)=>s+(t.credit||0),0);
  const mExp=mT.reduce((s,t)=>s+(t.debit||0),0);
  const mSav=mInc-mExp;
  const savR=mInc>0?((mSav/mInc)*100).toFixed(1):0;

  /* ── 12-month trend ── */
  const trend12=[];
  for(let i=11;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const m=d.toISOString().slice(0,7);
    const lb=d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"});
    const inc=allT.filter(t=>mk(t.date)===m).reduce((s,t)=>s+(t.credit||0),0);
    const exp=allT.filter(t=>mk(t.date)===m).reduce((s,t)=>s+(t.debit||0),0);
    trend12.push({name:lb,income:inc,expenses:exp,savings:Math.max(inc-exp,0)});
  }

  /* ── Expense by category ── */
  const catMap={};
  mT.forEach(t=>{if(t.debit>0){const c=t.category||"Misc";catMap[c]=(catMap[c]||0)+t.debit;}});
  const catArr=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const catPie=catArr.map(([name,value])=>({name,value}));
  const catMapAll={};
  allT.forEach(t=>{if(t.debit>0){const c=t.category||"Misc";catMapAll[c]=(catMapAll[c]||0)+t.debit;}});
  const catArrAll=Object.entries(catMapAll).sort((a,b)=>b[1]-a[1]);
  const allTimeSpent=allT.reduce((s,t)=>s+(t.debit||0),0);
  const topExp=mT.filter(t=>t.debit>0).sort((a,b)=>(b.debit||0)-(a.debit||0)).slice(0,10);

  /* ── Investments ── */
  const sv=investments.shares.reduce((s,x)=>s+(x.currentPrice||x.purchasePrice)*x.quantity,0);
  const sc=investments.shares.reduce((s,x)=>s+x.purchasePrice*x.quantity,0);
  const mv=investments.mutualFunds.reduce((s,x)=>s+(x.currentNav||x.purchaseNav)*x.units,0);
  const mc=investments.mutualFunds.reduce((s,x)=>s+x.purchaseNav*x.units,0);
  const iv=investments.insurance.reduce((s,x)=>s+(x.sumAssured||0),0);
  const invTotal=sv+mv; const invCost=sc+mc; const invPnL=invTotal-invCost;
  const invPnLPct=invCost>0?((invPnL/invCost)*100).toFixed(1):0;
  const invPie=[{name:"Shares",value:sv},{name:"Mutual Funds",value:mv},{name:"Insurance (SA)",value:iv}].filter(d=>d.value>0);

  /* ── Bills ── */
  const billList=bills||[];
  const billPaid=billList.filter(b=>b.status==="paid");
  const billUnpaid=billList.filter(b=>b.status!=="paid");
  const billTotal=billList.reduce((s,b)=>s+(b.amount||0),0);
  const billCatMap={};
  billList.forEach(b=>{const c=b.category||"Other";billCatMap[c]=(billCatMap[c]||0)+(b.amount||0);});
  const billCatArr=Object.entries(billCatMap).sort((a,b)=>b[1]-a[1]);
  const billCatPie=billCatArr.map(([name,value])=>({name,value}));
  const monthlyBills=billList.reduce((s,b)=>s+(b.freq==="yearly"?(b.amount||0)/12:b.freq==="quarterly"?(b.amount||0)/3:(b.amount||0)),0);
  const emiList=billList.filter(b=>b.totalEmis);

  /* ── Income module ── */
  const incomeList=income||[];
  const incReceived=incomeList.filter(x=>x.status==="received");
  const incPending=incomeList.filter(x=>x.status==="expected");
  const incRecTotal=incReceived.reduce((s,x)=>s+(x.amount||0),0);
  const incPendTotal=incPending.reduce((s,x)=>s+(x.amount||0),0);
  const incMonthly=incomeList.reduce((s,x)=>{
    const m=x.freq==="yearly"?(x.amount||0)/12:x.freq==="quarterly"?(x.amount||0)/3:x.freq==="one-time"?0:(x.amount||0);
    return s+m;
  },0);
  const incCatMap={};
  incomeList.forEach(x=>{
    const m=x.freq==="yearly"?(x.amount||0)/12:x.freq==="quarterly"?(x.amount||0)/3:x.freq==="one-time"?0:(x.amount||0);
    incCatMap[x.category]=(incCatMap[x.category]||0)+m;
  });
  const incCatPie=Object.entries(incCatMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

  /* ── Net worth ── */
  const bankBal=accounts.reduce((s,a)=>s+(a.balance||0),0);
  const cardOut=cards.reduce((s,c)=>s+(c.outstanding||0),0);
  const netWorth=bankBal+invTotal+iv-cardOut;
  const netWorthPie=[
    {name:"Bank Balances",value:bankBal},{name:"Shares",value:sv},
    {name:"Mutual Funds",value:mv},{name:"Insurance (SA)",value:iv},
  ].filter(d=>d.value>0);

  /* ── Subscriptions ── */
  const ms=subscriptions.reduce((s,x)=>s+(x.cycle==="yearly"?(x.amount||0)/12:(x.amount||0)),0);

  const TABS=[
    {id:"cashflow",l:"💹 Cash Flow"},{id:"expenses",l:"📤 Expenses"},
    {id:"income_report",l:"💵 Income"},{id:"bills_report",l:"🧾 Bills & EMI"},
    {id:"investment",l:"📈 Investments"},{id:"networth",l:"💰 Net Worth"},
    {id:"subscription",l:"🔄 Subscriptions"},
  ];

  const TabBtn=({id,l})=>(
    <button onClick={()=>setTab(id)} className={`px-3.5 py-2 rounded-lg text-xs font-medium transition whitespace-nowrap ${tab===id?"bg-indigo-600 text-white shadow-sm":"bg-white text-gray-600 hover:bg-gray-100 border border-gray-200"}`}>{l}</button>
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h1 className="text-xl font-bold text-gray-800">Reports &amp; Analytics</h1>
        <div className="flex gap-2">
          <button className={btnS} onClick={()=>window.print()} title="Print / Save as PDF">🖨 Print</button>
          <button className={btnS} onClick={()=>downloadCSV(allT,[
            {l:"Date",k:"date"},{l:"Description",k:"description"},{l:"Category",k:"category"},
            {l:"Debit",k:"debit",v:r=>r.debit||0},{l:"Credit",k:"credit",v:r=>r.credit||0},
          ],"all_transactions_"+tod()+".csv")}>⬇ All Transactions</button>
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-6">
        {TABS.map(t=><TabBtn key={t.id} id={t.id} l={t.l}/>)}
      </div>

      {/* ─── CASH FLOW ─── */}
      {tab==="cashflow" && (
        <div className="space-y-5">
          <div className="flex justify-end mb-1">
            <button className={btnS+" text-xs"} onClick={()=>downloadCSV(trend12,[
              {l:"Month",k:"name"},{l:"Income",k:"income"},{l:"Expenses",k:"expenses"},
              {l:"Savings",v:r=>r.income-r.expenses,l2:"Savings"},{l:"Savings%",v:r=>r.income>0?((r.income-r.expenses)/r.income*100).toFixed(1):0}
            ],"cashflow_"+tod()+".csv")}>⬇ Export CSV</button>
          </div>
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
            <Card title="This Month Income" value={fmt(mInc)} icon="📥" grad="green"/>
            <Card title="This Month Expenses" value={fmt(mExp)} icon="📤" grad="red"/>
            <Card title="Net Savings" value={fmt(mSav)} icon="💰" grad={mSav>=0?"indigo":"red"}/>
            <Card title="Savings Rate" value={savR+"%"} icon="📊" grad="purple"/>
          </div>
          <div className="bg-white rounded-xl border shadow-sm p-5">
            <h3 className="font-semibold text-gray-700 text-sm mb-4">Income vs Expenses — Last 12 Months</h3>
            <BarChart data={trend12} keys={["income","expenses"]} colors={["#10b981","#ef4444"]}/>
          </div>
          <div className="bg-white rounded-xl border shadow-sm p-5">
            <h3 className="font-semibold text-gray-700 text-sm mb-4">Monthly Savings Trend</h3>
            <BarChart data={trend12} keys={["savings"]} colors={["#6366f1"]}/>
          </div>
          <div className="bg-white rounded-xl border shadow-sm p-5">
            <h3 className="font-semibold text-gray-700 text-sm mb-4">Month-by-Month Summary</h3>
            <div className="overflow-x-auto">

                  <th className="text-right px-4 py-2.5 text-xs font-semibold text-gray-600">Buy NAV</th>
                  <th className="text-right px-4 py-2.5 text-xs font-semibold text-gray-600">Current NAV</th>
                  <th className="text-right px-4 py-2.5 text-xs font-semibold text-gray-600">Value</th>
                  <th className="text-right px-4 py-2.5 text-xs font-semibold text-gray-600">P&amp;L</th>
                </tr></thead>
                <tbody>
                  {investments.mutualFunds.map(f=>{
                    const cur=f.currentNav||f.purchaseNav;
                    const val=cur*f.units; const cost=f.purchaseNav*f.units;
                    const pnl=val-cost; const pp=cost>0?((pnl/cost)*100).toFixed(1):0;
                    return (
                      <tr key={f.id} className="border-b last:border-0 hover:bg-gray-50">
                        <td className="px-4 py-2.5 font-medium text-gray-800 max-w-xs truncate">{f.name}</td>
                        <td className="px-4 py-2.5 text-right text-gray-600">{f.units}</td>
                        <td className="px-4 py-2.5 text-right text-gray-600">{fmt(f.purchaseNav)}</td>
                        <td className="px-4 py-2.5 text-right text-gray-600">{fmt(cur)}</td>
                        <td className="px-4 py-2.5 text-right font-semibold text-indigo-600">{fmt(val)}</td>
                        <td className={`px-4 py-2.5 text-right font-semibold ${pnl>=0?"text-green-600":"text-red-600"}`}>{pnl>=0?"+":""}{fmt(pnl)} <span className="text-xs font-normal">({pp}%)</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {/* ─── NET WORTH ─── */}
      {tab==="networth" && (
        <div className="space-y-5">
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
            <Card title="Net Worth" value={fmt(netWorth)} icon="💰" grad="indigo"/>
            <Card title="Total Assets" value={fmt(bankBal+invTotal+iv)} icon="🏦" grad="green"/>
            <Card title="Total Liabilities" value={fmt(cardOut)} icon="💳" grad="red"/>
            <Card title="Debt Free?" value={cardOut===0?"✓ Yes":"✗ No"} icon="🎯" grad={cardOut===0?"green":"amber"}/>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className="bg-white rounded-xl border shadow-sm p-5">
              <h3 className="font-semibold text-gray-700 text-sm mb-3">Asset Allocation</h3>
              <PieChart data={netWorthPie} donut/>
            </div>
            <div className="bg-white rounded-xl border shadow-sm p-5">
              <h3 className="font-semibold text-gray-700 text-sm mb-3">Balance Sheet</h3>
              <div className="space-y-1">
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Assets</div>
                {accounts.map(a=>(
                  <div key={a.id} className="flex justify-between text-sm py-1 border-b border-gray-50">
                    <span className="text-gray-600">{a.bankName}{a.nickname?` (${a.nickname})`:""}</span>
                    <span className="font-medium text-green-700">{fmt(a.balance)}</span>
                  </div>
                ))}
                {sv>0&&<div className="flex justify-between text-sm py-1 border-b border-gray-50"><span className="text-gray-600">Shares Portfolio</span><span className="font-medium text-green-700">{fmt(sv)}</span></div>}
                {mv>0&&<div className="flex justify-between text-sm py-1 border-b border-gray-50"><span className="text-gray-600">Mutual Funds</span><span className="font-medium text-green-700">{fmt(mv)}</span></div>}
                {iv>0&&<div className="flex justify-between text-sm py-1 border-b border-gray-50"><span className="text-gray-600">Insurance (Sum Assured)</span><span className="font-medium text-green-700">{fmt(iv)}</span></div>}
                <div className="flex justify-between text-sm py-1.5 font-semibold text-green-700 border-t border-green-100">
                  <span>Total Assets</span><span>{fmt(bankBal+invTotal+iv)}</span>
                </div>
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mt-3 mb-2">Liabilities</div>
                {cards.map(c=>(
                  <div key={c.id} className="flex justify-between text-sm py-1 border-b border-gray-50">
                    <span className="text-gray-600">{c.cardName} (Credit Card)</span>
                    <span className="font-medium text-red-600">{fmt(c.outstanding)}</span>
                  </div>
                ))}
                {cards.length===0&&<div className="text-gray-400 text-sm py-1">No liabilities recorded</div>}
                <div className="flex justify-between text-sm py-1.5 font-semibold text-red-600 border-t border-red-100">
                  <span>Total Liabilities</span><span>{fmt(cardOut)}</span>
                </div>
                <div className="flex justify-between text-base py-2 font-bold border-t-2 border-indigo-200 text-indigo-700 mt-2">
                  <span>Net Worth</span><span>{fmt(netWorth)}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ─── SUBSCRIPTIONS ─── */}
      {tab==="subscription" && (
        <div className="space-y-5">
          <div className="grid grid-cols-3 gap-3">
            <Card title="Monthly Cost" value={fmt(ms)} icon="📅" grad="amber"/>
            <Card title="Annual Cost" value={fmt(ms*12)} icon="📆" grad="red"/>
            <Card title="Active" value={subscriptions.length} icon="🔄" grad="indigo"/>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className="bg-white rounded-xl border shadow-sm p-5">
              <h3 className="font-semibold text-gray-700 text-sm mb-3">Cost Distribution</h3>
              <PieChart data={subscriptions.map(s=>({name:s.name,value:s.cycle==="yearly"?(s.amount||0)/12:(s.amount||0)}))}/>
            </div>
            <div className="bg-white rounded-xl border shadow-sm p-5">
              <h3 className="font-semibold text-gray-700 text-sm mb-3">Monthly Cost Breakdown</h3>
              <div className="space-y-2">
                {[...subscriptions].sort((a,b)=>{
                  const am=a.cycle==="yearly"?(a.amount||0)/12:(a.amount||0);
                  const bm=b.cycle==="yearly"?(b.amount||0)/12:(b.amount||0);
                  return bm-am;
                }).map(s=>{
                  const mo=s.cycle==="yearly"?(s.amount||0)/12:(s.amount||0);
                  return (
                    <div key={s.id} className="flex items-center gap-3">
                      <div className="w-28 text-xs text-gray-600 truncate">{s.name}</div>
                      <div className="flex-1 bg-gray-100 rounded-full h-4">
                        <div className="h-4 rounded-full bg-amber-400" style={{width:`${ms>0?Math.max((mo/ms)*100,2):0}%`}}></div>
                      </div>
                      <div className="w-20 text-right text-xs font-medium text-gray-700">{fmt(mo)}/mo</div>
                    </div>
                  );

              {k:"name",l:"Name"},{k:"amount",l:"Amount",r:r=>fmt(r.amount)},{k:"cycle",l:"Cycle"},
              {k:"mc",l:"Monthly Cost",r:r=>fmt(r.cycle==="yearly"?(r.amount||0)/12:(r.amount||0))},
              {k:"rd",l:"Next Renewal",r:r=>fd(r.renewalDate)},
            ]} rows={subscriptions} empty="No subscriptions"/>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════
   INCOME
═══════════════════════════════════ */
const INCOME_CATS = ["Salary","Rental Income","Freelance / Consulting","Dividend","Interest","Business Income","Capital Gains","Bonus","Pension","Other"];
const INCOME_FREQ = ["monthly","quarterly","yearly","one-time"];

function Income({income,setIncome,accounts,setAccounts}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({});
  const [filter,setFilter]=useState("all");
  const [selCat,setSelCat]=useState("all");

  const fi = f=>setForm(p=>({...p,...f}));

  const save=()=>{
    if(!form.name||!form.amount) return;
    const entry={
      id:form.id||uid(),
      name:form.name,
      category:form.category||"Salary",
      amount:parseFloat(form.amount)||0,
      freq:form.freq||"monthly",
      expectedDate:form.expectedDate||"",
      receivedDate:form.receivedDate||"",
      status:form.status||"expected",
      accountId:form.accountId||"none",
      notes:form.notes||"",
    };
    if(form.id){
      setIncome(p=>p.map(x=>x.id===form.id?entry:x));
    } else {
      setIncome(p=>[...p,entry]);
    }
    setShowForm(false); setForm({});
  };

  const markReceived=(item)=>{
    setIncome(p=>p.map(x=>{
      if(x.id!==item.id) return x;
      return {...x,status:"received",receivedDate:x.receivedDate||tod()};
    }));
    // Auto-create credit transaction in linked account
    if(item.accountId && item.accountId!=="none") {
      setAccounts(p=>p.map(a=>{
        if(a.id!==item.accountId) return a;
        const txn={id:uid(),date:tod(),description:`Income: ${item.name}`,credit:item.amount||0,debit:0,category:"Income",notes:"Auto from Income"};
        const newBal=(parseFloat(a.balance)||0)+(item.amount||0);
        return {...a,balance:newBal,transactions:[...(a.transactions||[]),txn]};
      }));
    }
  };

  const del=id=>setIncome(p=>p.filter(x=>x.id!==id));

  const filtered=income.filter(x=>{
    const statusOk = filter==="all"||x.status===filter;
    const catOk = selCat==="all"||x.category===selCat;
    return statusOk&&catOk;
  });

  // Summary stats
  const totalMonthly=income.reduce((s,x)=>{
    const m=x.freq==="yearly"?(x.amount||0)/12:x.freq==="quarterly"?(x.amount||0)/3:x.freq==="one-time"?0:(x.amount||0);
    return s+m;
  },0);
  const totalAnnual=income.reduce((s,x)=>{
    const a=x.freq==="monthly"?(x.amount||0)*12:x.freq==="quarterly"?(x.amount||0)*4:(x.amount||0);
    return s+a;
  },0);
  const totalReceived=income.filter(x=>x.status==="received").reduce((s,x)=>s+(x.amount||0),0);
  const totalPending=income.filter(x=>x.status==="expected").reduce((s,x)=>s+(x.amount||0),0);

  // Category breakdown
  const catBreak={};
  income.forEach(x=>{
    const m=x.freq==="yearly"?(x.amount||0)/12:x.freq==="quarterly"?(x.amount||0)/3:x.freq==="one-time"?0:(x.amount||0);
    catBreak[x.category]=(catBreak[x.category]||0)+m;
  });
  const catPie=Object.entries(catBreak).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">Income</h1>
        <button className={btnP} onClick={()=>{setForm({status:"expected",freq:"monthly",category:"Salary"});setShowForm(true);}}>+ Add Income Source</button>
      </div>

      {/* Summary cards */}
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-6">
        <Card title="Monthly Expected" value={fmt(totalMonthly)} icon="📅" grad="green"/>
        <Card title="Annual Expected" value={fmt(totalAnnual)} icon="📆" grad="teal"/>
        <Card title="Total Received" value={fmt(totalReceived)} icon="✅" grad="indigo"/>
        <Card title="Pending Income" value={fmt(totalPending)} icon="⏳" grad="amber"/>
      </div>

      {/* Charts + form */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Monthly Income by Source</h3>
          {catPie.length>0 ? <PieChart data={catPie}/> : <div className="text-gray-400 text-sm text-center py-10">No income sources yet</div>}
        </div>
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Category Breakdown</h3>
          <div className="space-y-2">
            {catPie.map(c=>(
              <div key={c.name} className="flex items-center gap-2">
                <div className="w-28 text-xs text-gray-600 truncate">{c.name}</div>
                <div className="flex-1 bg-gray-100 rounded-full h-2">
                  <div className="bg-green-500 h-2 rounded-full" style={{width:`${totalMonthly>0?Math.round(c.value/totalMonthly*100):0}%`}}></div>
                </div>
                <div className="w-20 text-right text-xs font-medium text-gray-700">{fmt(c.value)}/mo</div>
              </div>
            ))}
            {catPie.length===0 && <div className="text-gray-400 text-sm text-center py-8">Add income sources to see breakdown</div>}
          </div>
        </div>
      </div>

      {/* Add/Edit Form */}
      {showForm && (
        <div className="bg-white rounded-xl border shadow-sm p-5 mb-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-4">{form.id?"Edit":"Add"} Income Source</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
            <div>
              <label className={lbl}>Name / Description</label>
              <input className={inp} placeholder="e.g. Monthly Salary, Rental — Flat 2A" value={form.name||""} onChange={e=>fi({name:e.target.value})}/>
            </div>
            <div>
              <label className={lbl}>Category</label>
              <select className={inp} value={form.category||"Salary"} onChange={e=>fi({category:e.target.value})}>
                {INCOME_CATS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className={lbl}>Amount (₹)</label>
              <input className={inp} type="number" placeholder="0" value={form.amount||""} onChange={e=>fi({amount:e.target.value})}/>
            </div>
            <div>
              <label className={lbl}>Frequency</label>
              <select className={inp} value={form.freq||"monthly"} onChange={e=>fi({freq:e.target.value})}>
                {INCOME_FREQ.map(f=><option key={f}>{f}</option>)}
              </select>
            </div>
            <div>
              <label className={lbl}>Expected Date</label>
              <input className={inp} type="date" value={form.expectedDate||""} onChange={e=>fi({expectedDate:e.target.value})}/>
            </div>
            <div>
              <label className={lbl}>Status</label>
              <select className={inp} value={form.status||"expected"} onChange={e=>fi({status:e.target.value})}>
                <option value="expected">Expected</option>
                <option value="received">Received</option>
              </select>
            </div>
            {form.status==="received" && (
              <div>
                <label className={lbl}>Received Date</label>
                <input className={inp} type="date" value={form.receivedDate||""} onChange={e=>fi({receivedDate:e.target.value})}/>
              </div>
            )}
            <div>
              <label className={lbl}>Linked Bank Account</label>
              <select className={inp} value={form.accountId||"none"} onChange={e=>fi({accountId:e.target.value})}>
                <option value="none">— None —</option>
                {accounts.map(a=><option key={a.id} value={a.id}>{a.bankName}{a.accountNumber?" ···"+a.accountNumber.slice(-4):""}</option>)}
              </select>
            </div>
            <div className="sm:col-span-2">
              <label className={lbl}>Notes</label>
              <input className={inp} placeholder="Optional notes" value={form.notes||""} onChange={e=>fi({notes:e.target.value})}/>
            </div>
          </div>
          <div className="flex gap-2">
            <button className={btnP} onClick={save}>Save</button>
            <button className={btnS} onClick={()=>{setShowForm(false);setForm({});}}>Cancel</button>
          </div>
        </div>
      )}

      {/* Filter bar */}
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        <span className="text-xs text-gray-500 font-medium">Filter:</span>
        {["all","expected","received"].map(v=>(
          <button key={v} onClick={()=>setFilter(v)}
            className={`px-3 py-1 rounded-full text-xs font-medium border ${filter===v?"bg-green-600 text-white border-green-600":"bg-white text-gray-600 border-gray-200 hover:border-green-300"}`}>
            {v.charAt(0).toUpperCase()+v.slice(1)}
          </button>
        ))}
        <select className="ml-2 text-xs border border-gray-200 rounded-lg px-2 py-1" value={selCat} onChange={e=>setSelCat(e.target.value)}>
          <option value="all">All Categories</option>
          {INCOME_CATS.map(c=><option key={c}>{c}</option>)}
        </select>
      </div>

      {/* Income table */}
      <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 border-b text-left">
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Name</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Category</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Amount</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Frequency</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Expected</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Received</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Status</th>
              <th className="px-4 py-2.5 font-semibold text-gray-600 text-xs">Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(x=>(
              <tr key={x.id} className="border-b last:border-0 hover:bg-gray-50">
                <td className="px-4 py-2.5">
                  <div className="font-medium text-gray-800">{x.name}</div>
                  {x.notes && <div className="text-xs text-gray-400">{x.notes}</div>}
                </td>
                <td className="px-4 py-2.5 text-gray-600">{x.category}</td>
                <td className="px-4 py-2.5 font-semibold text-green-700">{fmt(x.amount)}</td>
                <td className="px-4 py-2.5 text-gray-600 capitalize">{x.freq}</td>
                <td className="px-4 py-2.5 text-gray-600">{x.expectedDate?fd(x.expectedDate):"—"}</td>
                <td className="px-4 py-2.5 text-gray-600">{x.receivedDate?fd(x.receivedDate):"—"}</td>
                <td className="px-4 py-2.5">
                  <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${x.status==="received"?"bg-green-100 text-green-700":"bg-amber-100 text-amber-700"}`}>
                    {x.status==="received"?"✓ Received":"⏳ Expected"}
                  </span>
                </td>
                <td className="px-4 py-2.5">
                  <div className="flex gap-1.5">
                    {x.status==="expected" && (
                      <button className="text-xs bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 px-2 py-1 rounded-lg font-medium" onClick={()=>markReceived(x)}>
                        Mark Received
                      </button>
                    )}
                    <button className="text-xs bg-gray-50 hover:bg-gray-100 text-gray-600 border border-gray-200 px-2 py-1 rounded-lg" onClick={()=>{setForm({...x});setShowForm(true);}}>Edit</button>
                    <button className="text-xs bg-red-50 hover:bg-red-100 text-red-500 border border-red-100 px-2 py-1 rounded-lg" onClick={()=>del(x.id)}>✕</button>
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length===0 && (
              <tr><td colSpan="8" className="text-center text-gray-400 py-10 text-sm">No income sources found. Click "Add Income Source" to get started.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   SETTINGS
═══════════════════════════════════ */
function Settings({categories,setCategories}) {
  const [nc,setNc]=useState("");
  const add=()=>{if(nc.trim()&&!categories.includes(nc.trim())){setCategories(p=>[...p,nc.trim()]);setNc("");}};
  const del=c=>{if(!DEF_CATS.includes(c))setCategories(p=>p.filter(x=>x!==c));};
  const clear=()=>{if(confirm("Delete ALL data? This cannot be undone.")){Object.keys(localStorage).filter(k=>k.startsWith("ft_")).forEach(k=>localStorage.removeItem(k));window.location.reload();}};
  return (
    <div>
      <h1 className="text-xl font-bold text-gray-800 mb-5">Settings</h1>
      <div className="bg-white rounded-xl border shadow-sm p-5 mb-5">
        <h3 className="font-semibold text-gray-700 text-sm mb-3">Expense Categories</h3>
        <div className="flex gap-2 mb-3">
          <input className={`${inp} max-w-xs`} value={nc} onChange={e=>setNc(e.target.value)} placeholder="New category name" onKeyDown={e=>e.key==="Enter"&&add()}/>
          <button className={btnP} onClick={add}>Add</button>
        </div>
        <div className="flex flex-wrap gap-2">
          {categories.map(c=>(
            <span key={c} className="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm flex items-center gap-1.5">
              {c}{!DEF_CATS.includes(c)&&<button className="text-red-400 hover:text-red-600 text-xs" onClick={()=>del(c)}>✕</button>}
            </span>
          ))}
        </div>
      </div>
      <div className="bg-white rounded-xl border shadow-sm p-5 mb-5">
        <h3 className="font-semibold text-gray-700 text-sm mb-3">Auto-Categorization Rules</h3>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
          {Object.entries(AUTO_RULES).map(([k,v])=>(
            <div key={k} className="flex items-center gap-1.5 text-xs bg-gray-50 rounded-lg px-2.5 py-2">
              <span className="font-mono text-indigo-600">{k}</span>
              <span className="text-gray-400">→</span>
              <span className="text-gray-600">{v}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-white rounded-xl border shadow-sm p-5">
        <h3 className="font-semibold text-gray-700 text-sm mb-2">Data</h3>
        <p className="text-xs text-gray-400 mb-3">{db?"Your data is synced to Firebase Firestore (cloud). It is encrypted in transit and protected by Firebase security rules.":"Running in offline mode — data is stored in your browser's localStorage."}</p>
        <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs font-medium" onClick={clear}>Clear All Data</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════

function App() {
  /* ── Auth & app shell state ── */
  const [authState,setAuthState]=useState("loading"); // loading | authed | unauthed
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [dataLoaded,setDataLoaded]=useState(false);
  const [page,setPage]=useState("dashboard");
  const [col,setCol]=useState(false);
  const [showFeedback,setShowFeedback]=useState(false);

  /* ── App data ── */
  const [accounts,setAccounts]=useState([]);
  const [cards,setCards]=useState([]);
  const [investments,setInvestments]=useState({shares:[],mutualFunds:[],insurance:[]});
  const [subscriptions,setSubscriptions]=useState([]);
  const [bills,setBills]=useState([]);
  const [income,setIncome]=useState([]);
  const [categories,setCategories]=useState([...DEF_CATS]);

  const saveTimer=useRef(null);

  /* ── Load data from Firestore ── */
  const loadData=useCallback(async(uid)=>{
    try {
      const snap=await db.collection("users").doc(uid).collection("appdata").doc("main").get();
      if(snap.exists){
        const d=snap.data();
        setAccounts(d.accounts||[]);
        setCards(d.cards||[]);
        setInvestments(d.investments||{shares:[],mutualFunds:[],insurance:[]});
        setSubscriptions(d.subscriptions||[]);
        setBills(d.bills||[]);
        setIncome(d.income||[]);
        setCategories(d.categories||[...DEF_CATS]);
      } else {
        // First login — migrate any existing localStorage data
        setAccounts(ls("accounts",[]));
        setCards(ls("cards",[]));
        setInvestments(ls("investments",{shares:[],mutualFunds:[],insurance:[]}));
        setSubscriptions(ls("subscriptions",[]));
        setBills(ls("bills",[]));
        setIncome(ls("income",[]));
        setCategories(ls("categories",[...DEF_CATS]));
      }
    } catch(e){ console.error("Load error:",e); }
    setDataLoaded(true);
  },[]);

  /* ── Auth state listener ── */
  useEffect(()=>{
    if(!auth){
      // No Firebase — pure localStorage mode
      setUser({uid:"local",email:"local@device",displayName:"Local User"});
      setProfile({subscriptionStatus:"trial",trialEndsAt:new Date(Date.now()+TRIAL_DAYS*86400000).toISOString()});
      setAccounts(ls("accounts",[]));
      setCards(ls("cards",[]));
      setInvestments(ls("investments",{shares:[],mutualFunds:[],insurance:[]}));
      setSubscriptions(ls("subscriptions",[]));
      setBills(ls("bills",[]));
      setIncome(ls("income",[]));
      setCategories(ls("categories",[...DEF_CATS]));
      setDataLoaded(true);
      setAuthState("authed");
      return;
    }
    const unsub=auth.onAuthStateChanged(async(u)=>{
      if(u){
        setUser(u);
        // Load or create profile
        const profRef=db.collection("users").doc(u.uid);
        let profSnap=await profRef.get();
        if(!profSnap.exists){
          const trialEnd=new Date(Date.now()+TRIAL_DAYS*86400000).toISOString();
          await profRef.set({email:u.email,displayName:u.displayName||"",createdAt:new Date().toISOString(),trialEndsAt:trialEnd,subscriptionStatus:"trial",subscriptionEndsAt:null});
          profSnap=await profRef.get();
        }
        setProfile(profSnap.data());
        await loadData(u.uid);
        setAuthState("authed");
      } else {
        setUser(null);
        setProfile(null);
        setDataLoaded(false);
        setAuthState("unauthed");
      }
    });
    return unsub;
  },[loadData]);

  /* ── Debounced Firestore save ── */
  useEffect(()=>{
    if(!dataLoaded) return;
    const data={accounts,cards,investments,subscriptions,bills,income,categories};
    if(!db || !user || user.uid==="local"){
      // localStorage fallback
      ss("accounts",accounts); ss("cards",cards); ss("investments",investments);
      ss("subscriptions",subscriptions); ss("bills",bills); ss("income",income); ss("categories",categories);
      return;
    }
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try {
        await db.collection("users").doc(user.uid).collection("appdata").doc("main").set({...data,updatedAt:new Date().toISOString()});
      } catch(e){ console.error("Save error:",e); }
    },2000);
  },[accounts,cards,investments,subscriptions,bills,income,categories,dataLoaded,user]);

  /* ── Subscription check ── */
  const subStatus=useMemo(()=>{
    if(!profile) return {status:"trial",daysLeft:TRIAL_DAYS};
    if(profile.subscriptionStatus==="active"){
      const end=new Date(profile.subscriptionEndsAt||0);
      if(end>new Date()) return {status:"active",endsAt:profile.subscriptionEndsAt};
    }
    const trialEnd=new Date(profile.trialEndsAt||Date.now()+TRIAL_DAYS*86400000);
    const now=new Date();
    if(trialEnd>now){
      const daysLeft=Math.ceil((trialEnd-now)/86400000);
      return {status:"trial",daysLeft};
    }
    return {status:"expired"};
  },[profile]);

  const handleLogout=()=>{
    if(auth) auth.signOut();
    else { setUser(null); setAuthState("unauthed"); }
  };

  const handlePaid=async(txnId)=>{
    if(db&&user){
      try {
        const profRef=db.collection("users").doc(user.uid);
        const snap=await profRef.get();
        const existing=snap.data()?.pendingPayments||[];
        await profRef.update({pendingPayments:[...existing,{txnId,amount:SUB_PRICE,date:new Date().toISOString()}]});
      } catch(e){ console.error(e); }
    }
  };

  /* ── Render states ── */
  if(authState==="loading") return <LoadingScreen/>;
  if(authState==="unauthed") return <AuthScreen onAuth={u=>{setUser(u);setAuthState("authed");}}/>;
  if(!dataLoaded) return <LoadingScreen msg="Loading your data…"/>;
  if(subStatus.status==="expired") return <SubscriptionWall user={user} onLogout={handleLogout} onPaid={handlePaid}/>;

  const p={accounts,setAccounts,cards,setCards,investments,setInvestments,subscriptions,setSubscriptions,bills,setBills,income,setIncome,categories,setCategories};

  return (
    <div style={{display:"flex",minHeight:"100vh"}}>
      {showFeedback && <FeedbackModal user={user} onClose={()=>setShowFeedback(false)}/>}
      <Sidebar page={page} setPage={setPage} collapsed={col} setCollapsed={setCol}
        user={user} subStatus={subStatus}
        onFeedback={()=>setShowFeedback(true)}
        onLogout={handleLogout}
      />
      <main style={{flex:1,overflowY:"auto",maxHeight:"100vh"}} className="p-6">
        {page==="dashboard"     && <Dashboard {...p}/>}
        {page==="accounts"      && <BankAccounts {...p}/>}
        {page==="cards"         && <CreditCards {...p}/>}
        {page==="transactions"  && <Transactions {...p}/>}
        {page==="investments"   && <Investments {...p}/>}
        {page==="insurance"     && <Insurance {...p}/>}
        {page==="subscriptions" && <Subscriptions {...p}/>}
        {page==="bills"         && <Bills {...p}/>}
        {page==="income"        && <Income {...p}/>}
        {page==="upload"        && <UploadStatement {...p}/>}
        {page==="reports"       && <Reports {...p}/>}
        {page==="settings"      && <Settings {...p}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
