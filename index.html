/* ─── CSV export helper ─── */
const downloadCSV = (rows, cols, filename) => {
  const hdr = cols.map(c=>c.l).join(",");
  const body = rows.map(r => cols.map(c => {
    const v = c.v ? c.v(r) : (r[c.k]??'');
    return typeof v==="string" && v.includes(",") ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(",")).join("\n");
  const blob = new Blob([hdr+"\n"+body], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename || "export.csv";
  a.click();
};

/* ─── SVG Charts ─── */
function PieChart({data, donut=false, size=260}) {
  if(!data||!data.length) return <div className="text-gray-400 text-center py-12 text-sm">No data yet</div>;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(!total) return <div className="text-gray-400 text-center py-12 text-sm">No data yet</div>;
  const cx=size/2, cy=size/2, r=size*0.34, ir=donut?size*0.18:0;
  let ang = -Math.PI/2;
  const slices = data.map((d,i)=>{
    const theta = (d.value/total)*2*Math.PI;
    const ea = ang+theta; const ma = ang+theta/2;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(ea),  y2=cy+r*Math.sin(ea);
    const ix1=cx+ir*Math.cos(ea), iy1=cy+ir*Math.sin(ea);
    const ix2=cx+ir*Math.cos(ang),iy2=cy+ir*Math.sin(ang);
    const lg = theta>Math.PI?1:0;
    const path = donut
      ? `M${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} L${ix1} ${iy1} A${ir} ${ir} 0 ${lg} 0 ${ix2} ${iy2} Z`
      : `M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} Z`;
    const lx=cx+(r+22)*Math.cos(ma), ly=cy+(r+22)*Math.sin(ma);
    const pct = (d.value/total*100).toFixed(0);
    ang=ea;
    return {path, color:COLORS[i%COLORS.length], lx, ly, name:d.name, pct};
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{maxHeight:size}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="#fff" strokeWidth="1.5"/>)}
      {slices.map((s,i)=>(
        <text key={i} x={s.lx} y={s.ly} textAnchor="middle" fontSize="9.5" fill="#374151" fontWeight="500">
          <tspan x={s.lx} dy="0">{s.name}</tspan>
          <tspan x={s.lx} dy="12">{s.pct}%</tspan>
        </text>
      ))}
    </svg>
  );
}

function BarChart({data, keys, colors, height=220}) {
  if(!data||!data.length) return <div className="text-gray-400 text-center py-10 text-sm">No data yet</div>;
  const allVals = data.flatMap(d=>keys.map(k=>d[k]||0));
  const max = Math.max(...allVals, 1);
  const W=560, H=height, pad={t:16,b:40,l:55,r:10};
  const bW=(W-pad.l-pad.r)/data.length;
  const bGap=4;
  const bInner=(bW-bGap*2)/keys.length - 2;
  const yTick = v => { const a=v/1000; return a>=1?`₹${a.toFixed(0)}k`:`₹${v}`; };
  const ySteps = [0,0.25,0.5,0.75,1].map(f=>Math.round(f*max));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%">
      {ySteps.map((v,i)=>{
        const y = pad.t + (H-pad.t-pad.b)*(1-v/max);
        return <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={y} y2={y} stroke="#e5e7eb" strokeWidth="1"/>
          <text x={pad.l-6} y={y+4} textAnchor="end" fontSize="10" fill="#9ca3af">{yTick(v)}</text>
        </g>;
      })}
      {data.map((d,di)=>{
        const x0 = pad.l + di*bW + bGap;
        return <g key={di}>
          {keys.map((k,ki)=>{
            const val = d[k]||0;
            const bh = val/max*(H-pad.t-pad.b);
            const bx = x0 + ki*(bInner+2);
            const by = pad.t+(H-pad.t-pad.b)-bh;
            return <g key={ki}>
              <rect x={bx} y={by} width={bInner} height={bh} fill={colors[ki]} rx="3"/>
            </g>;
          })}
          <text x={x0+bW/2-bGap} y={H-pad.b+14} textAnchor="middle" fontSize="10" fill="#6b7280">{d.name}</text>
        </g>;
      })}
      {/* Legend */}
      {keys.map((k,i)=>(
        <g key={i} transform={`translate(${pad.l + i*90}, ${H-12})`}>
          <rect width="10" height="10" fill={colors[i]} rx="2"/>
          <text x="14" y="9" fontSize="10" fill="#374151" textTransform="capitalize">{k}</text>
        </g>
      ))}
    </svg>
  );
}

/* ═══════════════════════════════════
   AUTH SCREEN (Login / Signup)
═══════════════════════════════════ */
function AuthScreen({onAuth}) {
  const [mode,setMode]=useState("login"); // login | signup | reset
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [name,setName]=useState("");
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");
  const [busy,setBusy]=useState(false);

  const handle=async(e)=>{
    e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try {
      if(!auth) throw new Error("Firebase not configured. Fill in FIREBASE_CONFIG in the HTML file.");
      if(mode==="login"){
        const r=await auth.signInWithEmailAndPassword(email,pass);
        onAuth(r.user);
      } else if(mode==="signup"){
        if(!name.trim()) throw new Error("Please enter your name.");
        const r=await auth.createUserWithEmailAndPassword(email,pass);
        await r.user.updateProfile({displayName:name.trim()});
        onAuth(r.user);
      } else {
        await auth.sendPasswordResetEmail(email);
        setInfo("Password reset email sent! Check your inbox.");
        setMode("login");
      }
    } catch(ex){ setErr(ex.message||"Something went wrong."); }
    setBusy(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        {/* Logo */}
        <div className="text-center mb-8">
          <div className="text-5xl mb-3">💰</div>
          <h1 className="text-2xl font-bold text-white tracking-tight">FinTracker</h1>
          <p className="text-slate-400 text-sm mt-1">Your personal finance command centre</p>
        </div>

        {/* Card */}
        <div className="bg-white rounded-2xl shadow-2xl p-7">
          <h2 className="text-lg font-bold text-gray-800 mb-5">
            {mode==="login"?"Welcome back":mode==="signup"?"Create account":"Reset password"}
          </h2>
          <form onSubmit={handle} className="space-y-3">
            {mode==="signup" && (
              <div>
                <label className={lbl}>Full Name</label>
                <input className={inp} placeholder="Sandesh Jain" value={name} onChange={e=>setName(e.target.value)} required/>
              </div>
            )}
            <div>
              <label className={lbl}>Email</label>
              <input className={inp} type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
            </div>
            {mode!=="reset" && (
              <div>
                <label className={lbl}>Password</label>
                <input className={inp} type="password" placeholder={mode==="signup"?"Min 6 characters":"••••••••"} value={pass} onChange={e=>setPass(e.target.value)} required minLength={6}/>
              </div>
            )}
            {err && <div className="bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg px-3 py-2">{err}</div>}
            {info && <div className="bg-green-50 border border-green-200 text-green-700 text-xs rounded-lg px-3 py-2">{info}</div>}
            <button type="submit" disabled={busy} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition text-sm disabled:opacity-60">
              {busy?"Please wait…":mode==="login"?"Sign In":mode==="signup"?"Create Account":"Send Reset Email"}
            </button>
          </form>

          <div className="mt-4 space-y-2 text-center text-xs text-gray-500">
            {mode==="login" && <>
              <button onClick={()=>{setMode("signup");setErr("");}} className="text-indigo-600 hover:underline">Don't have an account? Sign up free</button>
              <div><button onClick={()=>{setMode("reset");setErr("");}} className="text-gray-400 hover:text-gray-600">Forgot password?</button></div>
            </>}
            {mode==="signup" && <button onClick={()=>{setMode("login");setErr("");}} className="text-indigo-600 hover:underline">Already have an account? Sign in</button>}
            {mode==="reset" && <button onClick={()=>{setMode("login");setErr("");}} className="text-indigo-600 hover:underline">Back to sign in</button>}
          </div>
        </div>

        {/* Trial info */}
        <div className="mt-6 bg-white/10 border border-white/20 rounded-xl p-4 text-center">
          <div className="text-white font-semibold text-sm mb-1">🎉 6 Months Free Trial</div>
          <div className="text-slate-300 text-xs">Full access for 180 days, then ₹{SUB_PRICE}/year</div>
        </div>
        {!auth && (
          <div className="mt-3 bg-amber-500/20 border border-amber-500/40 rounded-xl p-3 text-center">
            <div className="text-amber-300 text-xs font-medium">⚠️ Firebase not configured</div>
            <div className="text-amber-400/70 text-xs mt-0.5">Fill in FIREBASE_CONFIG in the HTML file to enable login.</div>
          </div>
        )}
      </div>
    </div>
  );
}

                    <input className={inp} placeholder="e.g. UPI/123456789012 or txn ref" value={txnId} onChange={e=>setTxnId(e.target.value)}/>
                  </div>
                  <button onClick={submitPayment} disabled={busy} className="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition disabled:opacity-60">
                    {busy?"Submitting…":"I've Paid — Submit Reference ID"}
                  </button>
                  <button onClick={()=>setStep("info")} className="w-full text-sm text-gray-400 hover:text-gray-600 py-1">← Back</button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   FEEDBACK MODAL
═══════════════════════════════════ */
function FeedbackModal({user, onClose}) {
  const [msg,setMsg]=useState("");
  const [rating,setRating]=useState(5);
  const [type,setType]=useState("general");
  const [busy,setBusy]=useState(false);
  const [sent,setSent]=useState(false);

  const submit=async()=>{
    if(!msg.trim()){alert("Please enter your feedback.");return;}
    setBusy(true);
    try {
      if(db) {
        await db.collection("feedback").add({
          uid: user?.uid||"anon",
          email: user?.email||"",
          type, rating, message: msg,
          createdAt: new Date().toISOString()
        });
      }
      setSent(true);
    } catch(e){ alert("Failed to send. Please try again."); }
    setBusy(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(0,0,0,.5)"}} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b">
          <h2 className="text-base font-semibold text-gray-800">💬 Send Feedback</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl w-7 h-7 flex items-center justify-center rounded-full hover:bg-gray-100">&times;</button>
        </div>
        <div className="px-6 py-5">
          {sent ? (
            <div className="text-center py-4">
              <div className="text-4xl mb-3">🙏</div>
              <div className="font-semibold text-gray-800 mb-1">Thank you!</div>
              <div className="text-sm text-gray-500 mb-4">Your feedback helps us improve FinTracker.</div>
              <button className={btnP} onClick={onClose}>Close</button>
            </div>
          ) : (
            <div className="space-y-4">
              <div>
                <label className={lbl}>Type</label>
                <div className="flex gap-2 flex-wrap">
                  {["general","bug","feature","billing","other"].map(t=>(
                    <button key={t} onClick={()=>setType(t)}
                      className={`px-3 py-1.5 rounded-full text-xs font-medium border transition capitalize ${type===t?"bg-indigo-600 text-white border-indigo-600":"bg-gray-50 text-gray-600 border-gray-200 hover:border-indigo-300"}`}>
                      {t}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className={lbl}>Rating</label>
                <div className="flex gap-1">
                  {[1,2,3,4,5].map(n=>(
                    <button key={n} onClick={()=>setRating(n)} className={`text-2xl transition ${n<=rating?"opacity-100":"opacity-30"}`}>⭐</button>
                  ))}
                </div>
              </div>
              <div>
                <label className={lbl}>Your feedback</label>
                <textarea className={inp+" resize-none"} rows={4} placeholder="Tell us what you think, what's missing, or what's broken…" value={msg} onChange={e=>setMsg(e.target.value)}/>
              </div>
              <div className="text-xs text-gray-400">Sent as: {user?.email||"anonymous"}</div>
              <div className="flex gap-2">
                <button className={btnP} onClick={submit} disabled={busy}>{busy?"Sending…":"Send Feedback"}</button>
                <button className={btnS} onClick={onClose}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   DASHBOARD
═══════════════════════════════════ */
function Dashboard({accounts,cards,investments,subscriptions,bills,income}) {
  const bankBal   = accounts.reduce((s,a)=>s+(a.balance||0),0);
  const cardOut   = cards.reduce((s,c)=>s+(c.outstanding||0),0);
  const sharesV   = investments.shares.reduce((s,x)=>s+(x.currentPrice||x.purchasePrice)*x.quantity,0);
  const mfV       = investments.mutualFunds.reduce((s,x)=>s+(x.currentNav||x.purchaseNav)*x.units,0);
  const insV      = investments.insurance.reduce((s,x)=>s+(x.sumAssured||0),0);
  const totalInv  = sharesV+mfV;
  const netWorth  = bankBal+totalInv+insV-cardOut;
  const monthlySubs = subscriptions.reduce((s,x)=>s+(x.cycle==="yearly"?(x.amount||0)/12:(x.amount||0)),0);
  const unpaidBills = (bills||[]).filter(b=>b.status!=="paid");
  const monthlyBills = (bills||[]).reduce((s,b)=>s+(b.freq==="yearly"?(b.amount||0)/12:b.freq==="quarterly"?(b.amount||0)/3:(b.amount||0)),0);

  // Income calculations
  const thisM = tod().slice(0,7);
  const incomeList = income||[];
  const monthlyIncomeSrcs = incomeList.reduce((s,x)=>{
    const mo = x.freq==="yearly"?(x.amount||0)/12:x.freq==="quarterly"?(x.amount||0)/3:x.freq==="one-time"?0:(x.amount||0);
    return s+mo;
  },0);
  const pendingIncome = incomeList.filter(x=>x.status==="expected");
  const in30 = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  const upcomingIncome = incomeList.filter(x=>x.status==="expected"&&x.expectedDate&&x.expectedDate>=tod()&&x.expectedDate<=in30);

  const allT = [
    ...accounts.flatMap(a=>(a.transactions||[]).map(t=>({...t}))),
    ...cards.flatMap(c=>(c.transactions||[]).map(t=>({...t})))
  ];
  const mT = allT.filter(t=>mk(t.date)===thisM);
  const mExp = mT.reduce((s,t)=>s+(t.debit||0),0);
  const mInc = mT.reduce((s,t)=>s+(t.credit||0),0);

  // Pie data
  const catMap = {};
  mT.forEach(t=>{if(t.debit>0){const c=t.category||"Misc";catMap[c]=(catMap[c]||0)+t.debit;}});
  const expPie = Object.entries(catMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value).slice(0,8);

  // Bar data – last 6 months
  const trend = [];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const m=d.toISOString().slice(0,7);
    const lb=d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"});
    trend.push({
      name:lb,
      income:allT.filter(t=>mk(t.date)===m).reduce((s,t)=>s+(t.credit||0),0),
      expenses:allT.filter(t=>mk(t.date)===m).reduce((s,t)=>s+(t.debit||0),0),
    });
  }

  // Inv alloc pie
  const invPie=[];
  if(sharesV>0) invPie.push({name:"Shares",value:sharesV});
  if(mfV>0)    invPie.push({name:"Mutual Funds",value:mfV});
  if(insV>0)   invPie.push({name:"Insurance",value:insV});

  const upcoming=[
    ...cards.filter(c=>c.paymentDueDate).map(c=>({type:"Card Due",name:c.cardName,date:c.paymentDueDate,amount:c.outstanding,color:"red"})),
    ...investments.insurance.filter(p=>p.premiumDueDate).map(p=>({type:"Insurance Premium",name:p.policyName,date:p.premiumDueDate,amount:p.annualPremium,color:"amber"})),
    ...subscriptions.filter(s=>s.renewalDate&&s.renewalDate>=tod()&&s.renewalDate<=in30).map(s=>({type:"Subscription",name:s.name,date:s.renewalDate,amount:s.amount,color:"indigo"})),
    ...(bills||[]).filter(b=>b.status!=="paid"&&b.dueDate&&b.dueDate>=tod()&&b.dueDate<=in30).map(b=>({type:"Bill Due",name:b.name,date:b.dueDate,amount:b.amount,color:"green"})),
    ...upcomingIncome.map(x=>({type:"Expected Income",name:x.name,date:x.expectedDate,amount:x.amount,color:"emerald"})),
  ].sort((a,b)=>a.date.localeCompare(b.date));

  return (
    <div>
      <h1 className="text-xl font-bold text-gray-800 mb-5">Dashboard</h1>
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-6">
        <Card title="Net Worth" value={fmt(netWorth)} icon="💰" grad="indigo"/>
        <Card title="Bank Balance" value={fmt(bankBal)} icon="🏦" grad="green"/>
        <Card title="Investments" value={fmt(totalInv)} icon="📈" grad="purple"/>
        <Card title="Card Outstanding" value={fmt(cardOut)} icon="💳" grad="red"/>
        <Card title="Monthly Expenses" value={fmt(mExp)} icon="📉" grad="amber"/>
        <Card title="Monthly Income (Txn)" value={fmt(mInc)} icon="💵" grad="cyan"/>
        <Card title="Monthly Bills" value={fmt(monthlyBills)} sub={`${unpaidBills.length} unpaid`} icon="🧾" grad="red"/>
        <Card title="Subscriptions" value={fmt(monthlySubs)} sub="/month" icon="🔄" grad="indigo"/>
        <Card title="Expected Monthly Income" value={fmt(monthlyIncomeSrcs)} sub={`${pendingIncome.length} pending`} icon="💰" grad="green"/>
        <Card title="Upcoming Income (30d)" value={fmt(upcomingIncome.reduce((s,x)=>s+(x.amount||0),0))} sub={`${upcomingIncome.length} sources`} icon="📥" grad="teal"/>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Expenses by Category — {new Date().toLocaleDateString("en-IN",{month:"long"})}</h3>
          <PieChart data={expPie}/>
        </div>
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Income vs Expenses (6 months)</h3>
          <BarChart data={trend} keys={["income","expenses"]} colors={["#10b981","#ef4444"]}/>
        </div>
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Investment Allocation</h3>
          <PieChart data={invPie} donut/>
        </div>
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-2">Subscriptions</h3>
          <div className="text-2xl font-bold text-indigo-600 mb-3">{fmt(monthlySubs)}<span className="text-sm text-gray-400 font-normal ml-1">/month</span></div>
          <div className="space-y-1.5">
            {subscriptions.slice(0,6).map(s=>(
              <div key={s.id} className="flex justify-between text-sm">
                <span className="text-gray-600">{s.name}</span>
                <span className="font-medium text-gray-800">{fmt(s.amount)}<span className="text-gray-400 text-xs">/{s.cycle==="yearly"?"yr":"mo"}</span></span>
              </div>
            ))}
            {!subscriptions.length && <div className="text-gray-400 text-sm text-center py-4">No subscriptions yet</div>}
          </div>
        </div>
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-2">Income Sources</h3>
          <div className="text-2xl font-bold text-green-600 mb-3">{fmt(monthlyIncomeSrcs)}<span className="text-sm text-gray-400 font-normal ml-1">/month</span></div>
          <div className="space-y-1.5">
            {incomeList.slice(0,6).map(x=>(
              <div key={x.id} className="flex justify-between text-sm items-center">
                <span className="text-gray-600">{x.name}</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${x.status==="received"?"bg-green-100 text-green-700":"bg-amber-100 text-amber-700"}`}>{x.status==="received"?"✓ Received":"Pending"}</span>
              </div>
            ))}
            {!incomeList.length && <div className="text-gray-400 text-sm text-center py-4">No income sources yet</div>}
          </div>
        </div>
      </div>

      {upcoming.length>0 && (
        <div className="bg-white rounded-xl border shadow-sm p-5">
          <h3 className="font-semibold text-gray-700 text-sm mb-3">Upcoming Reminders</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            {upcoming.map((u,i)=>(
              <div key={i} className={`rounded-lg p-3 border ${u.color==="red"?"bg-red-50 border-red-100":u.color==="amber"?"bg-amber-50 border-amber-100":u.color==="emerald"||u.color==="green"?"bg-green-50 border-green-100":"bg-indigo-50 border-indigo-100"}`}>
                <div className={`text-xs font-semibold mb-1 ${u.color==="red"?"text-red-500":u.color==="amber"?"text-amber-600":u.color==="emerald"||u.color==="green"?"text-green-600":"text-indigo-500"}`}>{u.type}</div>
                <div className="font-medium text-gray-800 text-sm">{u.name}</div>
                <div className="text-xs text-gray-500 mt-0.5">{fd(u.date)} · {fmt(u.amount)}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════
   BANK ACCOUNTS
═══════════════════════════════════ */
function BankAccounts({accounts,setAccounts,categories}) {
  const [sel, setSel] = useState(null);
  const [showA, setShowA] = useState(false);
  const [showT, setShowT] = useState(false);
  const [form, setForm] = useState({});
  const [tf, setTf] = useState({});

  const saveAcc = () => {
    if(!form.bankName) return;
    if(form.id) {
      setAccounts(p=>p.map(a=>a.id===form.id?{...a,...form}:a));
    } else {
      setAccounts(p=>[...p,{...form,id:uid(),balance:parseFloat(form.openingBalance)||0,transactions:[]}]);
    }
    setShowA(false); setForm({});
  };
  const delAcc = id=>{setAccounts(p=>p.filter(a=>a.id!==id));setSel(null);};
  const addTxn = ()=>{
    if(!sel||!tf.date) return;
    const t={...tf,id:uid(),debit:parseFloat(tf.debit)||0,credit:parseFloat(tf.credit)||0,category:tf.category||autoCat(tf.description)};
    setAccounts(p=>p.map(a=>{
      if(a.id!==sel.id) return a;
      const txns=[...(a.transactions||[]),t];
      const bal=(parseFloat(a.openingBalance)||0)+txns.reduce((s,x)=>s+(x.credit||0)-(x.debit||0),0);
      return {...a,transactions:txns,balance:bal};
    }));
    setShowT(false); setTf({});
  };
  const delTxn = tid=>setAccounts(p=>p.map(a=>{
    if(a.id!==sel.id) return a;
    const txns=(a.transactions||[]).filter(t=>t.id!==tid);
    const bal=(parseFloat(a.openingBalance)||0)+txns.reduce((s,t)=>s+(t.credit||0)-(t.debit||0),0);
    return {...a,transactions:txns,balance:bal};
  }));

  useEffect(()=>{if(sel){const u=accounts.find(a=>a.id===sel.id);if(u)setSel(u);}}, [accounts]);

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">{sel?sel.nickname||sel.bankName:"Bank Accounts"}</h1>
        <div className="flex gap-2">
          {sel && <button className={btnS} onClick={()=>setSel(null)}>← Back</button>}
          {!sel && <button className={btnP} onClick={()=>{setForm({});setShowA(true);}}>+ Add Account</button>}
          {sel && <button className={btnP} onClick={()=>{setTf({date:tod()});setShowT(true);}}>+ Add Transaction</button>}
        </div>
      </div>

      {!sel ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {accounts.map(a=>(
            <div key={a.id} onClick={()=>setSel(a)} className="bg-white rounded-xl border shadow-sm p-5 cursor-pointer hover:shadow-md hover:border-indigo-200 transition">
              <div className="flex justify-between items-start mb-3">
                <span className="text-2xl">🏦</span>
                <Tag color={a.type==="Current"?"amber":"green"}>{a.type||"Savings"}</Tag>
              </div>
              <div className="font-semibold text-gray-800">{a.bankName}</div>
              <div className="text-xs text-gray-500 mb-3">{a.nickname}</div>
              <div className="text-xl font-bold text-gray-900">{fmt(a.balance)}</div>
              <div className="text-xs text-gray-400 mt-1">{(a.transactions||[]).length} transactions</div>
            </div>
          ))}
          {!accounts.length && <div className="col-span-3 text-center text-gray-400 py-16 text-sm">No accounts yet — click "+ Add Account" to get started.</div>}
        </div>
      ) : (
        <div>
          <div className="grid grid-cols-3 gap-3 mb-5">
            <Card title="Current Balance" value={fmt(sel.balance)} icon="🏦" grad="green"/>
            <Card title="Total Credits" value={fmt((sel.transactions||[]).reduce((s,t)=>s+(t.credit||0),0))} icon="📥" grad="indigo"/>
            <Card title="Total Debits" value={fmt((sel.transactions||[]).reduce((s,t)=>s+(t.debit||0),0))} icon="📤" grad="red"/>
          </div>
          <div className="bg-white rounded-xl border shadow-sm p-5">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-semibold text-gray-700 text-sm">Transactions</h3>
              <button className={btnD} onClick={()=>delAcc(sel.id)}>Delete Account</button>
            </div>
            <Table cols={[
              {k:"date",l:"Date",r:r=>fd(r.date)},
              {k:"description",l:"Description"},
              {k:"category",l:"Category",r:r=><Tag>{r.category}</Tag>},
              {k:"debit",l:"Debit",r:r=>r.debit?<span className="text-red-600 font-medium">{fmt(r.debit)}</span>:""},
              {k:"credit",l:"Credit",r:r=>r.credit?<span className="text-green-600 font-medium">{fmt(r.credit)}</span>:""},
              {k:"balance",l:"Balance",r:r=>r.balance?<span className="text-gray-500 text-xs font-mono">{fmt(r.balance)}</span>:""},
              {k:"del",l:"",r:r=><button className="text-red-300 hover:text-red-500 text-xs" onClick={e=>{e.stopPropagation();delTxn(r.id)}}>✕</button>},
            ]} rows={[...(sel.transactions||[])].sort((a,b)=>b.date.localeCompare(a.date))} empty="No transactions yet"/>
          </div>
        </div>
      )}

      <Modal open={showA} onClose={()=>setShowA(false)} title="Add Bank Account">
        <F label="Bank Name"><input className={inp} value={form.bankName||""} onChange={e=>setForm({...form,bankName:e.target.value})} placeholder="e.g. HDFC Bank"/></F>
        <F label="Account Nickname"><input className={inp} value={form.nickname||""} onChange={e=>setForm({...form,nickname:e.target.value})} placeholder="e.g. Salary Account"/></F>
        <F label="Account Type"><select className={inp} value={form.type||"Savings"} onChange={e=>setForm({...form,type:e.target.value})}><option>Savings</option><option>Current</option></select></F>
        <F label="Opening Balance"><input type="number" className={inp} value={form.openingBalance||""} onChange={e=>setForm({...form,openingBalance:e.target.value})} placeholder="0"/></F>
        <div className="flex gap-2 pt-1"><button className={btnP} onClick={saveAcc}>Save Account</button><button className={btnS} onClick={()=>setShowA(false)}>Cancel</button></div>
      </Modal>

      <Modal open={showT} onClose={()=>setShowT(false)} title="Add Transaction">
        <F label="Date"><input type="date" className={inp} value={tf.date||""} onChange={e=>setTf({...tf,date:e.target.value})}/></F>
        <F label="Description"><input className={inp} value={tf.description||""} onChange={e=>setTf({...tf,description:e.target.value})} placeholder="e.g. Grocery shopping"/></F>
        <div className="grid grid-cols-2 gap-3">
          <F label="Debit (Expense)"><input type="number" className={inp} value={tf.debit||""} onChange={e=>setTf({...tf,debit:e.target.value})} placeholder="0"/></F>
          <F label="Credit (Income)"><input type="number" className={inp} value={tf.credit||""} onChange={e=>setTf({...tf,credit:e.target.value})} placeholder="0"/></F>
        </div>
        <F label="Category"><select className={inp} value={tf.category||""} onChange={e=>setTf({...tf,category:e.target.value})}><option value="">Auto-detect</option>{categories.map(c=><option key={c}>{c}</option>)}</select></F>
        <F label="Notes"><input className={inp} value={tf.notes||""} onChange={e=>setTf({...tf,notes:e.target.value})} placeholder="Optional"/></F>
        <div className="flex gap-2 pt-1"><button className={btnP} onClick={addTxn}>Add Transaction</button><button className={btnS} onClick={()=>setShowT(false)}>Cancel</button></div>
      </Modal>
    </div>
  );
}

/* ═══════════════════════════════════
   CREDIT CARDS
═══════════════════════════════════ */
function CreditCards({cards,setCards,categories}) {
  const [sel,setSel]=useState(null);
  const [showA,setShowA]=useState(false);
  const [showT,setShowT]=useState(false);
  const [form,setForm]=useState({});
  const [tf,setTf]=useState({});

  const saveCard=()=>{
    if(!form.bankName) return;
    if(form.id){setCards(p=>p.map(c=>c.id===form.id?{...c,...form}:c));}
    else{setCards(p=>[...p,{...form,id:uid(),outstanding:0,transactions:[]}]);}
    setShowA(false);setForm({});
  };
  const delCard=id=>{setCards(p=>p.filter(c=>c.id!==id));setSel(null);};
  const addTxn=()=>{
    if(!sel||!tf.date) return;
    const t={...tf,id:uid(),debit:parseFloat(tf.debit)||0,credit:parseFloat(tf.credit)||0,category:tf.category||autoCat(tf.description)};
    setCards(p=>p.map(c=>{
      if(c.id!==sel.id) return c;
      const txns=[...(c.transactions||[]),t];
      const out=txns.reduce((s,t)=>s+(t.debit||0)-(t.credit||0),0);
      return {...c,transactions:txns,outstanding:Math.max(0,out)};
    }));
    setShowT(false);setTf({});
  };
  useEffect(()=>{if(sel){const u=cards.find(c=>c.id===sel.id);if(u)setSel(u);}}, [cards]);

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">{sel?sel.cardName||sel.bankName:"Credit Cards"}</h1>
        <div className="flex gap-2">
          {sel && <button className={btnS} onClick={()=>setSel(null)}>← Back</button>}
          {!sel && <button className={btnP} onClick={()=>{setForm({});setShowA(true);}}>+ Add Card</button>}
          {sel && <button className={btnP} onClick={()=>{setTf({date:tod()});setShowT(true);}}>+ Add Transaction</button>}
        </div>
      </div>

      {!sel ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {cards.map(c=>{
            const util=c.creditLimit?Math.min(((c.outstanding/c.creditLimit)*100),100).toFixed(0):0;
            return (
              <div key={c.id} onClick={()=>setSel(c)} className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-5 text-white cursor-pointer hover:shadow-xl transition shadow-lg">
                <div className="flex justify-between mb-4">
                  <div><div className="text-xs opacity-60 mb-0.5">{c.bankName}</div><div className="font-bold">{c.cardName}</div></div>
                  <span className="text-2xl">💳</span>
                </div>
                <div className="mb-3"><div className="text-xs opacity-50 mb-0.5">Outstanding</div><div className="text-xl font-bold text-red-400">{fmt(c.outstanding)}</div></div>
                <div className="flex justify-between text-xs opacity-60 mb-1.5">
                  <span>Limit: {fmt(c.creditLimit)}</span><span>{util}% used</span>
                </div>
                <div className="bg-slate-700 rounded-full h-1.5">
                  <div className={`h-1.5 rounded-full transition-all ${util>80?"bg-red-400":util>50?"bg-amber-400":"bg-green-400"}`} style={{width:`${util}%`}}/>
                </div>
                {c.paymentDueDate && <div className="text-xs opacity-50 mt-2">Due: {fd(c.paymentDueDate)}</div>}
              </div>
            );
          })}
          {!cards.length && <div className="col-span-3 text-center text-gray-400 py-16 text-sm">No credit cards added yet.</div>}
        </div>
      ) : (
        <div>
          <div className="grid grid-cols-4 gap-3 mb-5">
            <Card title="Outstanding" value={fmt(sel.outstanding)} icon="💳" grad="red"/>
            <Card title="Credit Limit" value={fmt(sel.creditLimit)} icon="📊" grad="indigo"/>
            <Card title="Available" value={fmt((sel.creditLimit||0)-(sel.outstanding||0))} icon="✅" grad="green"/>
            <Card title="Due Date" value={sel.paymentDueDate?fd(sel.paymentDueDate):"N/A"} icon="📅" grad="amber"/>
          </div>
          <div className="bg-white rounded-xl border shadow-sm p-5">
            <div className="flex justify-between mb-4">
              <h3 className="font-semibold text-gray-700 text-sm">Transactions</h3>
              <button className={btnD} onClick={()=>delCard(sel.id)}>Delete Card</button>
            </div>
            <Table cols={[
              {k:"date",l:"Date",r:r=>fd(r.date)},{k:"description",l:"Description"},
              {k:"category",l:"Category",r:r=><Tag>{r.category}</Tag>},
              {k:"debit",l:"Spent",r:r=>r.debit?<span className="text-red-600 font-medium">{fmt(r.debit)}</span>:""},
              {k:"credit",l:"Payment",r:r=>r.credit?<span className="text-green-600 font-medium">{fmt(r.credit)}</span>:""},
            ]} rows={[...(sel.transactions||[])].sort((a,b)=>b.date.localeCompare(a.date))}/>
          </div>
        </div>
      )}

      <Modal open={showA} onClose={()=>setShowA(false)} title="Add Credit Card">
        <F label="Bank Name"><input className={inp} value={form.bankName||""} onChange={e=>setForm({...form,bankName:e.target.value})} placeholder="e.g. ICICI Bank"/></F>
        <F label="Card Name"><input className={inp} value={form.cardName||""} onChange={e=>setForm({...form,cardName:e.target.value})} placeholder="e.g. Amazon Pay Card"/></F>
        <F label="Credit Limit"><input type="number" className={inp} value={form.creditLimit||""} onChange={e=>setForm({...form,creditLimit:parseFloat(e.target.value)||0})}/></F>
        <div className="grid grid-cols-2 gap-3">
          <F label="Billing Cycle Start"><input type="date" className={inp} value={form.billingCycleStart||""} onChange={e=>setForm({...form,billingCycleStart:e.target.value})}/></F>
          <F label="Payment Due Date"><input type="date" className={inp} value={form.paymentDueDate||""} onChange={e=>setForm({...form,paymentDueDate:e.target.value})}/></F>
        </div>
        <div className="flex gap-2 pt-1"><button className={btnP} onClick={saveCard}>Save</button><button className={btnS} onClick={()=>setShowA(false)}>Cancel</button></div>
      </Modal>
      <Modal open={showT} onClose={()=>setShowT(false)} title="Add Card Transaction">
        <F label="Date"><input type="date" className={inp} value={tf.date||""} onChange={e=>setTf({...tf,date:e.target.value})}/></F>
        <F label="Description"><input className={inp} value={tf.description||""} onChange={e=>setTf({...tf,description:e.target.value})}/></F>
        <div className="grid grid-cols-2 gap-3">
          <F label="Spent (Debit)"><input type="number" className={inp} value={tf.debit||""} onChange={e=>setTf({...tf,debit:e.target.value})}/></F>
          <F label="Payment (Credit)"><input type="number" className={inp} value={tf.credit||""} onChange={e=>setTf({...tf,credit:e.target.value})}/></F>
        </div>
        <F label="Category"><select className={inp} value={tf.category||""} onChange={e=>setTf({...tf,category:e.target.value})}><option value="">Auto-detect</option>{categories.map(c=><option key={c}>{c}</option>)}</select></F>
        <div className="flex gap-2 pt-1"><button className={btnP} onClick={addTxn}>Add</button><button className={btnS} onClick={()=>setShowT(false)}>Cancel</button></div>
      </Modal>
    </div>
  );
}

/* ═══════════════════════════════════
   ALL TRANSACTIONS
═══════════════════════════════════ */
function Transactions({accounts,setAccounts,cards,setCards,categories}) {
  const [q,setQ]=useState("");
  const [cat,setCat]=useState("");
  const [src,setSrc]=useState("");
  const [df,setDf]=useState("");
  const [dt,setDt]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({type:"debit",date:tod(),category:"Miscellaneous"});

  const all = useMemo(()=>[
    ...accounts.flatMap(a=>(a.transactions||[]).map(t=>({...t,source:a.nickname||a.bankName,sType:"Bank",_aid:a.id}))),
    ...cards.flatMap(c=>(c.transactions||[]).map(t=>({...t,source:c.cardName||c.bankName,sType:"Card",_cid:c.id})))
  ].sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[accounts,cards]);

  const filtered=all.filter(t=>{
    if(q && !t.description?.toLowerCase().includes(q.toLowerCase())&&!t.source?.toLowerCase().includes(q.toLowerCase())) return false;
    if(cat&&t.category!==cat) return false;
    if(src&&t.source!==src) return false;
    if(df&&t.date<df) return false;
    if(dt&&t.date>dt) return false;
    return true;
  });

  const sources=[...new Set(all.map(t=>t.source))];

  const deleteTxn=(t)=>{
    if(!confirm("Delete this transaction? This cannot be undone.")) return;
    if(t._aid) setAccounts(p=>p.map(a=>a.id===t._aid?{...a,transactions:(a.transactions||[]).filter(x=>x.id!==t.id)}:a));
    else if(t._cid) setCards(p=>p.map(c=>c.id===t._cid?{...c,transactions:(c.transactions||[]).filter(x=>x.id!==t.id)}:c));
  };

  const saveTxn=()=>{
    if(!form.description||!form.accountId||!form.amount) return;
    const t={
      id:uid(), date:form.date||tod(),
      description:form.description,
      debit: form.type==="debit"?parseFloat(form.amount)||0:0,
      credit:form.type==="credit"?parseFloat(form.amount)||0:0,
      category:form.category||"Miscellaneous",
      notes:form.notes||"Manual entry",
    };
    const [sType,aId]=form.accountId.split("|");
    if(sType==="a") setAccounts(p=>p.map(a=>a.id===aId?{...a,transactions:[...(a.transactions||[]),t]}:a));
    else            setCards(p=>p.map(c=>c.id===aId?{...c,transactions:[...(c.transactions||[]),t]}:c));
    setShowForm(false);
    setForm({type:"debit",date:tod(),category:"Miscellaneous"});
  };

  const exportCSV=()=>downloadCSV(filtered,[
    {l:"Date",k:"date"},{l:"Account",k:"source"},{l:"Type",k:"sType"},
    {l:"Description",k:"description"},{l:"Category",k:"category"},
    {l:"Debit",k:"debit",v:r=>r.debit||0},{l:"Credit",k:"credit",v:r=>r.credit||0},
  ],`transactions_${tod()}.csv`);

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">All Transactions</h1>
        <div className="flex gap-2">
          <button className={btnS} onClick={exportCSV}>⬇ Export CSV</button>
          <button className={btnP} onClick={()=>{setForm({type:"debit",date:tod(),category:"Miscellaneous"});setShowForm(true);}}>+ Add Transaction</button>
        </div>
      </div>

      {/* Filter bar */}
      <div className="bg-white rounded-xl border shadow-sm p-4 mb-4 grid grid-cols-2 md:grid-cols-5 gap-2">
        <input className={inp} placeholder="🔍 Search…" value={q} onChange={e=>setQ(e.target.value)}/>
        <select className={inp} value={cat} onChange={e=>setCat(e.target.value)}>
          <option value="">All Categories</option>
          {categories.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className={inp} value={src} onChange={e=>setSrc(e.target.value)}>
          <option value="">All Accounts</option>
          {sources.map(s=><option key={s}>{s}</option>)}
        </select>
        <input type="date" className={inp} value={df} onChange={e=>setDf(e.target.value)}/>
        <input type="date" className={inp} value={dt} onChange={e=>setDt(e.target.value)}/>
      </div>

      {/* Add Transaction Form */}
      {showForm && (
        <div className="bg-white rounded-xl border shadow-sm p-5 mb-4">
          <h3 className="font-semibold text-gray-700 text-sm mb-4">Add Transaction</h3>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-3">
            <div>
              <label className={lbl}>Date</label>
              <input className={inp} type="date" value={form.date||tod()} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/>
            </div>
            <div className="col-span-2">
              <label className={lbl}>Description</label>
              <input className={inp} placeholder="e.g. Swiggy, Petrol" value={form.description||""} onChange={e=>setForm(p=>({...p,description:e.target.value}))}/>
            </div>
            <div>
              <label className={lbl}>Type</label>
              <select className={inp} value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>
                <option value="debit">Debit (Expense)</option>
                <option value="credit">Credit (Income)</option>
              </select>
            </div>
            <div>
              <label className={lbl}>Amount (₹)</label>
              <input className={inp} type="number" min="0" placeholder="0" value={form.amount||""} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}/>
            </div>
            <div>
              <label className={lbl}>Category</label>
              <select className={inp} value={form.category||"Miscellaneous"} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>
                {categories.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="col-span-2">
              <label className={lbl}>Account / Card</label>
              <select className={inp} value={form.accountId||""} onChange={e=>setForm(p=>({...p,accountId:e.target.value}))}>
                <option value="">— Select account —</option>
                {accounts.map(a=><option key={a.id} value={"a|"+a.id}>{a.bankName}{a.nickname?" ("+a.nickname+")":""}</option>)}
                {cards.map(c=><option key={c.id} value={"c|"+c.id}>{c.cardName} (Card)</option>)}
              </select>
            </div>
            <div className="col-span-2">
              <label className={lbl}>Notes (optional)</label>
              <input className={inp} placeholder="e.g. Weekend trip" value={form.notes||""} onChange={e=>setForm(p=>({...p,notes:e.target.value}))}/>
            </div>
          </div>
          <div className="flex gap-2">
            <button className={btnP} onClick={saveTxn}>Save Transaction</button>
            <button className={btnS} onClick={()=>setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}

      {/* Table */}
      <div className="bg-white rounded-xl border shadow-sm p-5">
        <div className="flex justify-between items-center mb-3">
          <div className="text-xs text-gray-400">{filtered.length} transactions</div>
          <div className="text-xs text-gray-400">
            Total debit: <span className="text-red-500 font-medium">{fmt(filtered.reduce((s,t)=>s+(t.debit||0),0))}</span>
            {" · "}Total credit: <span className="text-green-600 font-medium">{fmt(filtered.reduce((s,t)=>s+(t.credit||0),0))}</span>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-gray-100">
              <th className="text-left py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Date</th>
              <th className="text-left py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Account</th>
              <th className="text-left py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Description</th>
              <th className="text-left py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Category</th>
              <th className="text-right py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Debit</th>
              <th className="text-right py-2.5 px-3 text-xs text-gray-500 font-semibold uppercase">Credit</th>
              <th className="py-2.5 px-3"></th>
            </tr></thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={r.id||i} className="border-b border-gray-50 hover:bg-gray-50 transition group">
                  <td className="py-2.5 px-3 text-gray-500 text-xs whitespace-nowrap">{fd(r.date)}</td>
                  <td className="py-2.5 px-3"><Tag color={r.sType==="Card"?"purple":"blue"}>{r.source}</Tag></td>
                  <td className="py-2.5 px-3 text-gray-700 max-w-xs truncate">{r.description}</td>
                  <td className="py-2.5 px-3"><Tag>{r.category}</Tag></td>
                  <td className="py-2.5 px-3 text-right">{r.debit?<span className="text-red-600 font-medium">{fmt(r.debit)}</span>:""}</td>
                  <td className="py-2.5 px-3 text-right">{r.credit?<span className="text-green-600 font-medium">{fmt(r.credit)}</span>:""}</td>
                  <td className="py-2.5 px-3">
                    <button onClick={()=>deleteTxn(r)} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 text-xs px-2 py-1 rounded hover:bg-red-50 transition">✕</button>
                  </td>
                </tr>
              ))}
              {!filtered.length && <tr><td colSpan="7" className="text-center text-gray-400 py-10 text-sm">No transactions match the filters</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   INVESTMENTS
═══════════════════════════════════ */
function Investments({investments,setInvestments}) {
  const [tab,setTab]=useState("shares");
  const [show,setShow]=useState(false);
  const [form,setForm]=useState({});
  const sv=investments.shares.reduce((s,x)=>s+(x.currentPrice||x.purchasePrice)*x.quantity,0);
  const sc=investments.shares.reduce((s,x)=>s+x.purchasePrice*x.quantity,0);
  const mv=investments.mutualFunds.reduce((s,x)=>s+(x.currentNav||x.purchaseNav)*x.units,0);
  const mc=investments.mutualFunds.reduce((s,x)=>s+x.purchaseNav*x.units,0);
  const saveShare=()=>{
    if(!form.stockName) return;
    const item={...form,id:form.id||uid(),quantity:parseFloat(form.quantity)||0,purchasePrice:parseFloat(form.purchasePrice)||0,currentPrice:parseFloat(form.currentPrice)||parseFloat(form.purchasePrice)||0};
    setInvestments(p=>({...p,shares:form.id?p.shares.map(s=>s.id===form.id?item:s):[...p.shares,item]}));
    setShow(false);setForm({});
  };
  const saveMF=()=>{
    if(!form.fundName) return;
    const item={...form,id:form.id||uid(),units:parseFloat(form.units)||0,purchaseNav:parseFloat(form.purchaseNav)||0,currentNav:parseFloat(form.currentNav)||parseFloat(form.purchaseNav)||0};
    setInvestments(p=>({...p,mutualFunds:form.id?p.mutualFunds.map(m=>m.id===form.id?item:m):[...p.mutualFunds,item]}));
    setShow(false);setForm({});
  };
  const del=(type,id)=>setInvestments(p=>({...p,[type]:p[type].filter(x=>x.id!==id)}));
  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-xl font-bold text-gray-800">Investments</h1>
        <button className={btnP} onClick={()=>{setForm({});setShow(true);}}>+ Add {tab==="shares"?"Share":"Mutual Fund"}</button>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <Card title="Shares Value" value={fmt(sv)} sub={`P&L: ${fmt(sv-sc)}`} icon="📊" grad={sv>=sc?"green":"red"}/>
        <Card title="MF Value" value={fmt(mv)} sub={`P&L: ${fmt(mv-mc)}`} icon="📈" grad={mv>=mc?"green":"red"}/>
        <Card title="Total Portfolio" value={fmt(sv+mv)} icon="💎" grad="purple"/>
        <Card title="Total P&L" value={fmt((sv+mv)-(sc+mc))} icon="💰" grad={(sv+mv)>=(sc+mc)?"green":"red"}/>
      </div>
      <div className="flex gap-2 mb-4">
        {[{id:"shares",l:"Shares"},{id:"mf",l:"Mutual Funds"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${tab===t.id?"bg-indigo-600 text-white":"bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>
            {t.l} ({t.id==="shares"?investments.shares.length:investments.mutualFunds.length})
          </button>
        ))}
      </div>
      <div className="bg-white rounded-xl border shadow-sm p-5">
        {tab==="shares" && <Table cols={[
          {k:"stockName",l:"Stock"},{k:"ticker",l:"Ticker",r:r=><span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{r.ticker}</span>},
          {k:"qty",l:"Qty",r:r=>r.quantity},
          {k:"bp",l:"Buy Price",r:r=>fmt(r.purchasePrice)},
          {k:"cp",l:"Current",r:r=>fmt(r.currentPrice||r.purchasePrice)},
          {k:"val",l:"Value",r:r=>fmt((r.currentPrice||r.purchasePrice)*r.quantity)},
          {k:"pl",l:"P&L",r:r=>{const pl=((r.currentPrice||r.purchasePrice)-r.purchasePrice)*r.quantity;return <span className={pl>=0?"text-green-600":"text-red-600"}>{fmt(pl)}</span>}},
          {k:"d",l:"",r:r=><button className="text-red-300 hover:text-red-500 text-xs" onClick={()=>del("shares",r.id)}>✕</button>},
        ]} rows={investments.shares} empty="No shares tracked yet"/>}
        {tab==="mf" && <Table cols={[
          {k:"fundName",l:"Fund"},{k:"units",l:"Units"},
          {k:"pn",l:"Buy NAV",r:r=>fmt(r.purchaseNav)},
          {k:"cn",l:"Current NAV",r:r=>fmt(r.currentNav||r.purchaseNav)},
          {k:"val",l:"Value",r:r=>fmt((r.currentNav||r.purchaseNav)*r.units)},
          {k:"pl",l:"Gain/Loss",r:r=>{const pl=((r.currentNav||r.purchaseNav)-r.purchaseNav)*r.units;return <span className={pl>=0?"text-green-600":"text-red-600"}>{fmt(pl)}</span>}},
